<script>
window.confirm = () => true; // the hosted viewer blocks confirm(); demo deletes are harmless and resettable
const sanitizeHtml = h => String(h || '')
  .replace(/<\s*(script|style|iframe|object|embed|link|meta|form)[\s\S]*?(<\/\s*\1\s*>|$)/gi, '')

/* ---------- input cleaning ---------- */
const S = (v, max = 500) => String(v == null ? '' : v).trim().slice(0, max);
const N = v => { const n = Number(v); return isFinite(n) ? n : 0; };

const plat = v => { const t = S(v, 40); if (!t) return 'Direct'; return PLAT[t.toLowerCase()] || t.replace(/[^\w .&-]/g, '').slice(0, 30) || 'Other'; };
const attrOf = b => { const a = (b && typeof b.attr === 'object' && b.attr) || {}; return { platform: plat(a.platform), medium: S(a.medium, 30).replace(/[^\w .-]/g, ''), campaign: S(a.campaign, 60).replace(/[^\w .-]/g, ''), referrer: S(a.referrer, 80).replace(/[^\w.-]/g, ''), landing: S(a.landing, 120) }; };
const B = v => v === true || v === 'true' || v === 1;
const A = (v, max = 300) => (Array.isArray(v) ? v : String(v || '').split('\n')).map(x => S(x, max)).filter(Boolean).slice(0, 100);
function clean(schema, input) {
  const o = {};
  for (const [k, t] of Object.entries(schema)) {
    if (!(k in input)) continue; const v = input[k];

  }

}

al residents gather daily for prayers. Continue to Buddha Dordenma at Buddha Point, one of the world's largest seated Buddha statues, offering panoramic views of Thimphu Valley. Later, visit the Motithang Takin Preserve, home to Bhutan's national animal. Continue your sightseeing with visits to the National Library, the National Institute of Traditional Medicine, the Textile Museum, the Traditional Handmade Paper Factory and the Handicrafts Emporium to learn more about Bhutan's rich cultural heritage and traditional craftsmanship. Conclude the day's sightseeing with a visit to Tashichho Dzong, the administrative and religious centre of Bhutan, before returning to your hotel for an overnight stay in Thimphu."},{"title":"Excursion to Punakha via Dochula Pass (3,050m)","meta":"75 km One Way · Approx. 2.5 Hours","desc":"After breakfast, drive to Punakha via Dochula Pass, one of Bhutan's most scenic mountain passes. Visit the famous 108 Druk Wangyal Chortens before continuing your journey through the picturesque Himalayan landscape. Continue to Punakha Dzong, built in 1637 at the confluence of the Pho Chhu and Mo Chhu rivers. It is one of Bhutan's most significant religious and historical landmarks. After lunch, enjoy a pleasant walk through the countryside to Chimi Lhakhang, also known as the Fertility Temple, dedicated to Lama Drukpa Kunley, widely known as the Divine Madman. Later, drive back to Thimphu and spend the evening at leisure before your overnight stay in Thimphu."},{"title":"Departure from Thimphu to Paro Airport","meta":"54 km · Approx. 2 Hours","desc":"After breakfast, check out from your hotel and drive to Paro International Airport for your onward flight . Your Fly In Fly Out Bhutan journey concludes today. Crafted with care by La Bhutanz Tours."}],"inclusions":["Handpicked hotels on twin-sharing basis (category flexible to your budget)","Private vehicle with experienced driver for all transfers and sightseeing","Experienced local English/Hindi-speaking d. Depending on your travel preferences, fitness level, interests and available time, the itinerary can be personalised to create a more meaningful Bhutan experience."},{"q":"Is the Tiger's Nest hike compulsory?","a":"No. The hike is optional. Guests may hike as far as they are comfortable, stop at the viewpoint café or spend the day exploring other attractions in Paro based on their preferences."},{"q":"What is the best time to visit Bhutan for this itinerary?","a":"Spring (March to May) and Autumn (September to November) are considered the best seasons, offering pleasant weather, clear mountain views and vibrant festivals. However, Bhutan has its own unique charm throughout the year."},{"q":"Is this tour suitable for families and senior travellers?","a":"Yes. With shorter driving days, comfortable overnight stays and a relaxed itinerary, this journey is well suited for families, couples and senior travellers who prefer travelling at a comfortable pace."},{"q":"What type of accommodation is included during the journey?","a":"Accommodation is completely flexible. Depending on your preferences and budget, we can recommend carefully selected 3-star, 4-star, 5-star or luxury boutique hotels across Thimphu, Punakha and Paro."},{"q":"Why choose a private Fly In Fly Out Bhutan tour instead of a group tour?","a":"A private journey offers greater flexibility, personalised attention and the freedom to travel at your own pace. It allows you to spend more time at places that interest you while enjoying a more comfortable and meaningful Bhutan experience."}],"image":"img/photos/valley-town.jpg","poster":"img/packages/fly-6n7d-poster.jpg","imageHasTitle":true,"flightIncluded":false,"featured":false,"active":true,"order":2,"priceConfirmed":false},{"id":"fly-7n8d","slug":"fly-7n8d","category":"fly","name":"Fly In Fly Out","nights":7,"days":8,"price":0,"singleSupplement":0,"stay":"","summary":"A relaxed western Bhutan journey with time to explore Punakha and Paro valleys at leisure.","intro":"Discover Bhutan at a comfortable and unhurried pace with our thoughtfully curated 7 Nights / 8 Days Fly In Fly Out Bhutan Tour. Designed for travellers who wish to experience more than the country's iconic landmarks, this itinerary combines cultural heritage, scenic mountain landscapes and authentic local experiences while allowing ample time to relax and appreciate Bhutan's peaceful way of life.\n\nWith two nights each in Thimphu and Punakha, followed by three nights in the beautiful Paro Valley, you'll enjoy shorter driving days, greater flexibility and opportunities to explore beyond the usual sightseeing circuit. From the panoramic views of Dochula Pass and the architectural splendor of Punakha Dzong to the legendary Tiger's Nest Monastery and the breathtaking landscapes around Paro, every day has been carefully planned to create a balanced and memorable Bhutan journey.\n\n\"Whether you are travelling as a couple, with family or seeking a more immersive Bhutan experience, this itinerary offers the perfect balance of exploration, comfort and meaningful moments.\"","highlights":["Explore Bhutan's three most iconic destinations – Thimphu, Punakha and Paro.","Enjoy a slower and more immersive Bhutan experience with additional time to appreciate the country's culture, landscapes and peaceful way of life.","Enjoy a relaxed journey with two nights in Thimphu, two nights in Punakha and three nights in the beautiful Paro Valley.","Enjoy a relaxed journey with two nights in Thimphu, two nights in Punakha and three nights in the beautiful Paro Valley.","Cross the spectacular Dochula Pass (3,050m) with breathtaking Himalayan mountain views on clear days.","Visit the magnificent Punakha Dzong, the sacred Chimi Lhakhang and experience Bhutan's peaceful countryside.","Discover Bhutanese culture through monasteries, traditional architecture, vibrant local markets and authentic local experiences.","Explore the historic Rinpung Dzong, National Museum and the charming streets of Paro.","Hike to the iconic Tiger's Nest Monastery (Paro Taktsang), Bhutan's most revered landmark.","Enjoy additional time in Paro with opportunities to explore nearby attractions such as Chele La Pass or simply experience the valley at a relaxed pace, depending on your interests and seasonal conditions.","Travel comfortably with a private vehicle, experienced local guide and personalised assistance throughout your journey."],"itinerary":[{"title":"Arrival in Paro","meta":"Transfer to Thimphu","desc":"Arrive at Paro International Airport, where our representative will warmly welcome you. Begin your scenic drive to Thimphu, Bhutan's charming capital city. En route, enjoy your first glimpses of traditional Bhutanese architecture, river valleys and forested landscapes. Depending on your arrival time, visit Memorial Chorten, Buddha Dordenma (Buddha Point) and explore the lively streets of Thimphu. Overnight at Thimphu."},{"title":"Thimphu Sightseeing","meta":"","desc":"Spend the day discovering Bhutan's cultural and administrative capital. Visit important landmarks including the National Folk Heritage Museum, Traditional Handmade Paper Factory, Motithang Takin Preserve and Tashichho Dzong. You may also explore local handicraft stores and experience Bhutan's unique blend of tradition and modernity. Overnight at Thimphu."},{"title":"Thimphu to Punakha via Dochula Pass","meta":"","desc":"After breakfast, drive towards Punakha via the spectacular Dochula Pass (3,050m). On clear days, enjoy magnificent panoramic views of the snow-capped Himalayan peaks. Continue to Punakha and visit the beautiful Punakha Dzong, one of Bhutan's most significant and picturesque monasteries. Later, enjoy a pleasant walk to Chimi Lhakhang, also known as the Temple of Fertility. Overnight at Punakha."},{"title":"Explore Punakha Valley","meta":"","desc":"Enjoy a leisurely day discovering the natural beauty and cultural charm of Punakha Valley. Begin with a visit to the beautiful Khamsum Yulley Namgyal Chorten, a stunning hilltop temple offering panoramic views of the surrounding rice fields, river valleys and mountains. Later, experience one of Bhutan's longest suspension bridges, beautifully draped with colourful prayer flags and overlooking the serene Pho Chhu River. Continue exploring the peaceful countryside through traditional villages, scenic farmlands and authentic local experiences that showcase Bhutan's simple way of life. The relaxed pace of the day allows you to appreciate Punakha beyond its iconic landmarks and experience the tranquil beauty that makes this valley one of Bhutan's most loved destinations. Overnight at Punakha."},{"title":"Punakha to Paro","meta":"","desc":"After breakfast, drive back towards Paro, passing once again through the beautiful mountain landscapes and Dochula Pass. Upon arrival, visit Ta Dzong (National Museum) and Rinpung Dzong, both offering fascinating insights into Bhutan's history, culture and religious heritage. Overnight at Paro."},{"title":"Excursion to Tiger's Nest Monastery","meta":"","desc":"Today, experience one of Bhutan's most iconic attractions—the hike to Paro Taktsang, famously known as Tiger's Nest Monastery. Perched dramatically on a cliffside, this sacred monastery is among the most revered pilgrimage sites in the Himalayas. The hike rewards visitors with breathtaking scenery and an unforgettable spiritual experience. After returning, enjoy a relaxed evening in Paro town. Overnight at Paro."},{"title":"Explore Paro Valley at leisure","meta":"","desc":"Enjoy an additional day in the beautiful Paro Valley, allowing you to experience Bhutan at a slower and more immersive pace. Depending on your interests and seasonal conditions, you may choose to visit the scenic Chele La Pass (3,988m), one of Bhutan's highest motorable mountain passes offering spectacular views of the Himalayan ranges and, on clear days, glimpses of Mt. Jomolhari. Travellers may also opt for an excursion to the serene Haa Valley, known for its untouched landscapes, traditional villages and authentic Bhutanese charm. Alternatively, you may prefer a leisurely day exploring Paro's local cafés, traditional farmhouses, cultural sites and peaceful surroundings, or simply unwind and enjoy a wellness-focused day amidst Bhutan's tranquil mountain atmosphere. This additional day provides the flexibility to personalise your Bhutan experience and discover the country beyond its iconic highlights. Overnight at Paro."},{"title":"Departure from Paro","meta":"","desc":"After breakfast, transfer to Paro International Airport for your onward journey. Depart Bhutan with unforgettable memories of its peaceful monasteries, dramatic landscapes and warm hospitality."}],"inclusions":["Handpicked hotels on twin-sharing basis (category flexible to your budget)","Private vehicle with experienced driver for all transfers and sightseeing","Experienced local English/Hindi-speaking guide","Airport / border pick-up and drop","Assistance with Bhutan Entry Permit, SDF payment and documentation","24×7 on-trip support from La Bhutanz Tours"],"exclusions":["Sustainable Development Fee (SDF) — Nu. 1,200 per person per night for Indian citizens (children 6–12 half, under 6 free)","Flights / train fare to and from Bhutan (unless the package says flights are included)","Attraction entrance fees, camera fees and activity costs","Travel insurance (mandatory)","Personal expenses — laundry, beverages, tips and anything not listed in inclusions","Costs from natural calamities, landslides, road blockages or strikes, payable on the spot","5% GST on tour services (if not already included in the quoted price)"],"ideal":["Couples seeking a romantic and peaceful Himalayan escape.","Families looking for a relaxed itinerary with comfortable travel days and meaningful experiences.","First-time visitors who wish to experience Bhutan beyond a rushed sightseeing schedule.","Nature lovers who enjoy mountain landscapes, scenic valleys, countryside experiences and Himalayan viewpoints.","Cultural travellers interested in Bhutan's monasteries, dzongs, traditions and spiritual heritage.","Travellers seeking a balanced journey that combines exploration, relaxation and authentic local experiences.","Guests who appreciate having additional time in Paro for optional excursions to places such as Chele La Pass or Haa Valley, or simply to enjoy Bhutan's tranquil atmosphere at a leisurely pace."],"faqs":[{"q":"Is 7 Nights / 8 Days enough to explore Bhutan comfortably?","a":"Yes. This itinerary offers a relaxed pace and allows travellers to experience Bhutan's major destinations—Thimphu, Punakha and Paro—without feeling rushed."},{"q":"What makes this itinerary different from the 6 Nights / 7 Days tour?","a":"The additional night in Paro provides greater flexibility for optional excursions such as Chele La Pass or Haa Valley and allows more leisure time to enjoy Bhutan's peaceful atmosphere."},{"q":"Is the Tiger's Nest hike included in this itinerary?","a":"Yes. A dedicated day has been allocated for visiting the iconic Tiger's Nest Monastery, one of Bhutan's most revered landmarks."},{"q":"Can senior travellers undertake this itinerary?","a":"Absolutely. The itinerary follows a comfortable pace with manageable driving durations. The Tiger's Nest hike is optional and can be adjusted according to individual preferences and fitness levels."},{"q":"Which destinations are covered in this journey?","a":"This itinerary includes stays in Thimphu, Punakha and Paro, covering Bhutan's most popular cultural, historical and scenic regions."},{"q":"What is the best time to visit Bhutan for this itinerary?","a":"Spring (March to May) and Autumn (September to November) are considered the best seasons, offering pleasant weather, clear mountain views and vibrant festivals."},{"q":"Can this itinerary be customised?","a":"Yes. This itinerary can be thoughtfully personalised based on your interests, preferred travel pace and travel style. Additional experiences such as cultural activities, wellness experiences, village visits, Chele La Pass excursions and Haa Valley exploration can be incorporated accordingly."},{"q":"Is this itinerary suitable for families with children?","a":"Yes. The relaxed pace, multiple-night stays and balanced sightseeing schedule make this itinerary particularly suitable for families travelling with children and multi-generational groups."},{"q":"Do Indian travellers require a visa to visit Bhutan?","a":"Indian citizens do not require a visa for Bhutan. However, a Bhutan entry permit is mandatory and can be arranged through a licensed Bhutanese tour operator."}],"image":"img/photos/paro-valley.jpg","poster":"img/packages/fly-7n8d-poster.jpg","imageHasTitle":true,"flightIncluded":false,"featured":false,"active":true,"order":3,"priceConfirmed":false},{"id":"drive-6n7d","slug":"drive-6n7d","category":"drive","name":"Drive In Drive Out","nights":6,"days":7,"price":0,"singleSupplement":0,"stay":"| Paro 2N","summary":"Enter overland from Bagdogra / NJP via Phuentsholing and watch the landscape change.","intro":"Experience Bhutan through one of the most scenic overland journeys in the Himalayas with our thoughtfully curated 6 Nights / 7 Days Drive In Drive Out Bhutan Tour. Entering Bhutan via Phuentsholing allows travellers to witness the gradual transition from the plains of India to Bhutan's peaceful mountain landscapes, traditional villages and culturally rich valleys.\n\nWith two nights each in Phuentsholing, Thimphu and Paro, this itinerary offers a comfortable pace while covering Bhutan's most iconic destinations. Along the journey, travellers can experience beautiful mountain roads, charming local settlements, historic monasteries and Bhutan's unique way of life.\n\nFrom the cultural attractions of Thimphu and the spiritual significance of Tiger's Nest Monastery to the scenic beauty of Paro Valley, this itinerary provides a balanced blend of nature, culture and authentic Bhutanese experiences.","highlights":["Experience one of Bhutan's most scenic overland journeys through beautiful mountain landscapes and changing Himalayan scenery.","Enjoy a slower and more immersive Bhutan experience with additional time to appreciate the country's culture, landscapes and peaceful way of life.","Witness the gradual transition from the Indian plains to Bhutan's peaceful valleys, forests and traditional settlements.","Explore Bhutan's capital city, Thimphu, and discover its unique blend of tradition and modernity.","Visit iconic attractions including Buddha Dordenma, Memorial Chorten, Tashichho Dzong and local cultural sites.","Experience the charm of Paro Valley and explore its historic monasteries, traditional architecture and scenic surroundings.","Hike to the legendary Tiger's Nest Monastery (Paro Taktsang), Bhutan's most revered landmark.","Enjoy a relaxed and immersive road journey, allowing ample time to appreciate Bhutan's landscapes, culture and peaceful way of life.","Travel comfortably with a private vehicle, experienced local guide and personalised assistance throughout your Bhutan journey."],"itinerary":[{"title":"Arrival at Bagdogra Airport / NJP Railway Station","meta":"Transfer to Phuentsholing (293m) · Approx. 170 km · Approx. 4.5–5 Hours","desc":"Upon arrival at Bagdogra Airport or NJP Railway Station, meet your representative and begin your scenic drive towards Phuentsholing, the gateway to Bhutan. Situated at the foothills of the Himalayas, Phuentsholing offers a perfect introduction to Bhutan's peaceful atmosphere and unique cultural charm. After completing immigration formalities, check in to your hotel and spend the remainder of the day at leisure. Depending on your arrival time, you may enjoy a relaxed walk around the town and experience the gradual transition from India into the serene environment of Bhutan. Overnight stay in Phuentsholing."},{"title":"Phuentsholing (293m)","meta":"Transfer to Thimphu (2,334m) · Approx. 150 km · Approx. 5–6 Hours","desc":"After breakfast, begin your picturesque mountain drive towards Thimphu, Bhutan's charming capital city. The journey takes you through lush forests, beautiful river valleys, waterfalls and traditional settlements, offering some of the most scenic landscapes in the country. As you ascend into the Himalayas, enjoy numerous photo opportunities along the route. Upon arrival in Thimphu, check in to your hotel and spend the evening at leisure. Overnight stay in Thimphu."},{"title":"Explore Thimphu (2,334m)","meta":"","desc":"After breakfast, proceed for a full day of sightseeing in Bhutan's fascinating capital city. Visit the magnificent Buddha Dordenma Statue, one of the world's largest seated Buddha statues overlooking the valley. Continue to the Memorial Chorten, one of Bhutan's most revered religious landmarks where locals gather for daily prayers. Later, visit Tashichho Dzong, the administrative and monastic centre of Bhutan. Depending on your interests and available time, explore Simply Bhutan, the Folk Heritage Museum, National Institute for Zorig Chusum and local handicraft markets. Enjoy a leisurely evening exploring Thimphu town. Overnight stay in Thimphu."},{"title":"Thimphu (2,334m)","meta":"Transfer to Paro (2,280m) · Approx. 55 km · Approx. 1.5 Hours","desc":"After breakfast, proceed towards the beautiful Paro Valley, one of Bhutan's most scenic and historically significant destinations. Upon arrival, visit some of Paro's cultural landmarks, including Rinpung Dzong, an impressive fortress monastery known for its traditional Bhutanese architecture and rich history. Continue to Kyichu Lhakhang, one of the oldest and most sacred temples in Bhutan, dating back to the 7th century. Spend the remainder of the day exploring Paro town, local cafés and handicraft shops at a relaxed pace. Overnight stay in Paro."},{"title":"Explore Paro (2,280m)","meta":"Tiger's Nest Monastery Excursion","desc":"After breakfast, undertake one of Bhutan's most iconic experiences – the hike to Tiger's Nest Monastery (Paro Taktsang). Perched dramatically on a cliff approximately 900 metres above the Paro Valley, this sacred monastery is among Bhutan's most important pilgrimage sites and offers breathtaking views of the surrounding mountains and valleys. After descending from the monastery, spend the remainder of the day at leisure or continue exploring Paro Valley. Overnight stay in Paro."},{"title":"Paro (2,280m)","meta":"Transfer to Phuentsholing (293m) · Approx. 145 km · Approx. 5–6 Hours","desc":"After breakfast, enjoy a relaxed morning in Paro. Depending on your interests and available time, you may choose to visit Chele La Pass, one of Bhutan's highest motorable passes, offering magnificent Himalayan views and pristine alpine landscapes. Travellers seeking a slower pace may instead enjoy additional leisure time in Paro town. Later, begin your scenic drive back towards Phuentsholing. Upon arrival, check in to your hotel and relax after the journey. Overnight stay in Phuentsholing."},{"title":"Phuentsholing (293m)","meta":"Departure to Bagdogra Airport / NJP Railway Station · Approx. 170 km · Approx. 4.5–5 Hours","desc":"After breakfast, bid farewell to the Kingdom of Bhutan and proceed towards Bagdogra Airport or NJP Railway Station for your onward journey. As your memorable Bhutan holiday comes to an end, return home with unforgettable experiences, breathtaking Himalayan landscapes and cherished memories of Bhutan's unique culture, warm hospitality and peaceful way of life. Your drive back marks the conclusion of a memorable overland Bhutan experience."}],"inclusions":["Handpicked hotels on twin-sharing basis (category flexible to your budget)","Private vehicle with experienced driver for all transfers and sightseeing","Experienced local English/Hindi-speaking guide","Airport / border pick-up and drop","Assistance with Bhutan Entry Permit, SDF payment and documentation","24×7 on-trip support from La Bhutanz Tours" aceful countryside landscapes of the valley. Overnight stay in Punakha."},{"title":"Punakha (1,242m)","meta":"Transfer to Paro (2,280m) · Approx. 125 km · Approx. 4–5 Hours","desc":"After breakfast, enjoy a leisurely morning in Punakha. Depending on available time, you may visit Chimi Lhakhang, popularly known as the Temple of Fertility, or enjoy short walks through traditional villages and agricultural landscapes. Later, proceed towards Paro. Upon arrival, check in to your hotel and spend the evening exploring Paro town, local cafés and handicraft shops. Overnight stay in Paro."},{"title":"Explore Paro (2,280m)","meta":"Tiger's Nest Monastery Excursion","desc":"After breakfast, undertake one of Bhutan's most iconic experiences – the hike to Tiger's Nest Monastery (Paro Taktsang), dramatically perched on a cliffside above the Paro Valley. Later, depending on available time and interests, visit Rinpung Dzong, Kyichu Lhakhang, one of Bhutan's oldest temples, or simply enjoy a relaxed evening in Paro town. Overnight stay in Paro."},{"title":"Paro (2,280m)","meta":"Transfer to Phuentsholing (293m) · Approx. 145 km · Approx. 5–6 Hours","desc":"After breakfast, bid farewell to the beautiful valleys of Bhutan and begin your return journey towards Phuentsholing. This overnight halt provides a comfortable break in the journey before continuing towards Bagdogra or NJP the following day, allowing travellers greater flexibility based on their onward flight or train schedules. Upon arrival, check in to your hotel and relax after the scenic drive. Overnight stay in Phuentsholing."},{"title":"Phuentsholing (293m)","meta":"Departure to Bagdogra Airport / NJP Railway Station · Approx. 170 km · Approx. 4.5–5 Hours","desc":"After breakfast, proceed towards Bagdogra Airport or NJP Railway Station for your onward journey. As your memorable Bhutan journey concludes, return home with unforgettable experiences, peaceful moments and a deeper appreciation for Bhutan's unique culture, breathtaking landscapes and warm hospitality. Tour Ends with Wonderful Memories of Bhutan."}],"inclusions":["Handpicked hotels on twin-sharing basis (category flexible to your budget)","Private vehicle with experienced driver for all transfers and sightseeing","Experienced local English/Hindi-speaking guide","Airport / border pick-up and drop","Assistance with Bhutan Entry Permit, SDF payment and documentation","24×7 on-trip support from La Bhutanz Tours"],"exclusions":["Sustainable Development Fee (SDF) — Nu. 1,200 per person per night for Indian citizens (children 6–12 half, under 6 free)","Flights / train fare to and from Bhutan (unless the package says flights are included)","Attraction entrance fees, camera fees and activity costs","Travel insurance (mandatory)","Personal expenses — laundry, beverages, tips and anything not listed in inclusions","Costs from natural calamities, landslides, road blockages or strikes, payable on the spot","5% GST on tour services (if not already included in the quoted price)"],"ideal":["Families looking for a comfortable and scenic Bhutan holiday with a balanced pace.","Couples and honeymooners seeking a combination of nature, culture and peaceful mountain experiences.","Travellers who prefer overland journeys and enjoy witnessing changing landscapes and local life along the route.","First-time visitors to Bhutan who wish to experience the country's major destinations without rushing.","Photography enthusiasts interested in capturing mountain scenery, monasteries, traditional architecture and rural landscapes.","Cultural travellers keen to explore Bhutan's heritage, monasteries, fortresses and authentic Bhutanese traditions.","Senior travellers who prefer a gradual and immersive travel experience with comfortable overnight stays.","Nature lovers looking to experience valleys, mountain passes, forests and peaceful countryside settings.","Travellers seeking a deeper Bhutan experience beyond the standard highlights by including the beautiful Punakha Valley."],"faqs":[{"q":"Is 7 Nights / 8 Days enough for a Bhutan road trip?","a":"Yes. This itinerary offers a comfortable pace to explore Phuentsholing, Thimphu, Punakha and Paro while allowing sufficient time for sightseeing, relaxation and cultural experiences."},{"q":"Which destinations are covered in this itinerary?","a":"This journey includes Phuentsholing, Thimphu, Punakha and Paro, covering Bhutan's major cultural, scenic and spiritual highlights."},{"q":"How long is the drive from Phuentsholing to Thimphu?","a":"The drive usually takes around 5 to 6 hours, depending on road conditions and sightseeing stops along the route."},{"q":"Is the Tiger's Nest hike included in this itinerary?","a":"Yes. The itinerary includes a full day in Paro, allowing travellers to undertake the famous hike to Tiger's Nest Monastery."},{"q":"Is this itinerary suitable for senior travellers and families?","a":"Yes. With two-night stays in major destinations and only one overnight stay in Punakha, the itinerary is designed at a comfortable pace suitable for families and senior travellers."},{"q":"What can travellers experience in Punakha?","a":"Punakha offers beautiful valley landscapes, the magnificent Punakha Dzong, suspension bridge experiences, village walks and visits to places such as Chimi Lhakhang."},{"q":"What is the best time to undertake this Bhutan overland journey?","a":"Spring (March to May) and Autumn (September to November) are considered ideal due to pleasant weather, clear mountain views and vibrant landscapes."},{"q":"Can this itinerary be customised?","a":"Yes. The itinerary can be personalised based on travel interests, preferred hotels, wellness experiences, photography interests, festivals or additional destinations."},{"q":"Is this itinerary suitable for first-time visitors to Bhutan?","a":"Absolutely. It provides a well-balanced introduction to Bhutan by combining cultural attractions, scenic drives, peaceful valleys and iconic experiences like Tiger's Nest Monastery."}],"image":"img/photos/chortens.jpg","poster":"img/packages/drive-7n8d-poster.jpg","imageHasTitle":true,"flightIncluded":false,"featured":false,"active":true,"order":5,"priceConfirmed":false},{"id":"meditation-7n8d","slug":"meditation-7n8d","category":"special","name":"Meditation Tour","nights":7,"days":8,"price":0,"singleSupplement":0,"stay":"","summary":"A contemplative journey through sacred monasteries, meditation centres and peaceful valleys.","intro":"Bhutan, often referred to as the Last Shangri-La, offers a rare environment where spirituality, nature and mindful living continue to flourish in harmony. Surrounded by pristine forests, sacred monasteries and peaceful Himalayan landscapes, the kingdom provides an ideal setting for travellers seeking inner peace and meaningful experiences.\n\nThis 7 Nights / 8 Days Meditation Journey has been thoughtfully designed for travellers wishing to slow down, reconnect with themselves and experience Bhutan's deeply rooted spiritual traditions. The journey combines visits to sacred monasteries, opportunities for meditation and reflection, peaceful nature experiences and the unique cultural heritage of Bhutan.\n\nFrom the tranquil valleys of Paro and Punakha to the spiritual atmosphere of Gangtey and Thimphu, this journey allows travellers to immerse themselves in mindfulness, wellness and authentic Bhutanese hospitality.","highlights":["Experience a peaceful journey through Bhutan's most spiritually significant destinations.","Visit ancient monasteries, sacred temples and meditation centres across Paro, Thimphu, Punakha and Gangtey.","Enjoy opportunities for mindfulness, meditation and personal reflection amidst the Himalayan landscapes.","Experience the peaceful atmosphere of Gangtey Valley and Bhutan's deeply rooted Buddhist traditions.","Explore the iconic Tiger's Nest Monastery, one of Bhutan's most revered spiritual sites.","Discover Bhutan's unique approach to happiness, well-being and mindful living.","Enjoy gentle nature walks, traditional hot stone bath experiences and moments of relaxation.","Experience authentic Bhutanese culture, monasteries and traditional village life.","Travel at a slower pace allowing time for spiritual rejuvenation and meaningful experiences.","Enjoy a thoughtfully curated journey combining wellness, spirituality and Himalayan serenity."],"itinerary":[{"title":"Arrive at Paro International Airport","meta":"Explore Paro Valley (2,280m)","desc":"As your flight approaches Paro, enjoy breathtaking views of the Himalayan mountain ranges, including the sacred peaks of Jomolhari and Jichu Drake. Upon arrival at Paro International Airport, you will be warmly welcomed by your Bhutanese guide. Spend the remainder of the day at a relaxed pace, allowing time to acclimatise to Bhutan's peaceful surroundings. Enjoy a gentle exploration of Paro Valley, visit local temples and begin immersing yourself in the kingdom's unique spiritual atmosphere. The evening may be reserved for quiet reflection, meditation and relaxation amidst the serene Himalayan landscapes. Overnight at Paro."},{"title":"Explore Paro Valley (2,280m)","meta":"","desc":"Spend the day exploring some of Paro's most sacred and culturally significant sites. Visit Kyichu Lhakhang, one of Bhutan's oldest and holiest temples, believed to have been built in the 7th century. Continue to Rinpung Dzong, an impressive fortress monastery showcasing Bhutan's traditional architecture and spiritual heritage. Enjoy leisurely walks through Paro town and the surrounding countryside, offering opportunities for mindfulness, personal reflection and experiencing Bhutan's traditional way of life. The peaceful surroundings of Paro provide an ideal setting for meditation and spiritual rejuvenation. Overnight at Paro."},{"title":"Excursion to Tiger's Nest Monastery (Taktsang Monastery) (3,120m)","meta":"","desc":"Embark on one of Bhutan's most spiritual experiences with an excursion to the iconic Tiger's Nest Monastery. Perched dramatically on a cliff approximately 900 meters above the Paro Valley, Taktsang Monastery is one of Bhutan's most revered pilgrimage sites. According to legend, Guru Rinpoche arrived here on the back of a flying tigress and meditated in a cave, making this one of the kingdom's most sacred places. The hike offers not only spectacular scenery but also an opportunity for introspection, mindfulness and spiritual connection. Spend time absorbing the peaceful atmosphere before descending back to the valley. Overnight at Paro."},{"title":"Paro (2,280m)","meta":"Transfer to Thimphu (2,334m) · Approx. 55 km · Approx. 1.5 Hours","desc":"Leave Paro behind and proceed towards Bhutan's charming capital city, Thimphu. Enroute, enjoy the changing landscapes and peaceful mountain scenery. Upon arrival, begin exploring the spiritual and cultural attractions of the capital, including Memorial Chorten and other important religious landmarks. The remainder of the day can be spent enjoying the relaxed atmosphere of Thimphu, visiting monasteries, prayer sites and experiencing Bhutan's unique approach to mindful living and well-being. Overnight at Thimphu."},{"title":"Explore Thimphu (2,334m)","meta":"","desc":"Spend the day exploring the spiritual and cultural treasures of Bhutan's capital city. Visit Buddha Dordenma, one of the world's largest seated Buddha statues, offering magnificent views over Thimphu Valley and a peaceful setting for meditation and reflection. Continue to the National Memorial Chorten, where locals gather daily for prayers and spiritual practices. Visit traditional monasteries, prayer sites and the Folk Heritage Museum to gain deeper insights into Bhutan's unique philosophy of happiness and mindful living. The remainder of the day can be enjoyed at a relaxed pace, allowing time for personal reflection and peaceful walks around the valley. Overnight at Thimphu."},{"title":"Thimphu (2,334m)","meta":"Transfer to Punakha (1,242m) · Approx. 75 km · Approx. 3 Hours","desc":"Leave Thimphu behind and journey towards the beautiful valley of Punakha via Dochula Pass (3,150m). Enjoy panoramic views of the Eastern Himalayas and spend some quiet moments amidst the peaceful surroundings of the 108 Druk Wangyal Chortens. Continue towards Punakha and visit the magnificent Punakha Dzong, beautifully situated at the confluence of the Pho Chhu and Mo Chhu rivers. The serene atmosphere of Punakha provides an ideal environment for relaxation and mindfulness. Enjoy gentle walks through traditional villages and peaceful countryside landscapes. Overnight at Punakha."},{"title":"Punakha (1,242m)","meta":"Transfer to Paro (2,280m) · Approx. 125 km · Approx. 4.5 Hours","desc":"Begin your return journey towards Paro, enjoying Bhutan's scenic mountain landscapes and tranquil valleys along the way. Depending on time and personal interests, the day may include visits to sacred temples, traditional farmhouses or simply moments of relaxation amidst Bhutan's peaceful environment. Upon arrival in Paro, spend your final evening reflecting on your spiritual journey through the Kingdom of Bhutan. A traditional Bhutanese hot stone bath experience can also be arranged, offering a perfect conclusion to your wellness and meditation journey. Overnight at Paro."},{"title":"Departure from Paro","meta":"","desc":"Bid farewell to your Bhutanese hosts and conclude your memorable meditation journey through Bhutan. Depart with cherished memories of sacred monasteries, peaceful valleys and meaningful moments of mindfulness and self-reflection experienced across the kingdom. As your meditation journey through Bhutan comes to an end, take with you not only beautiful memories of the Himalayas but also moments of peace, mindfulness and spiritual rejuvenation. Bhutan's tranquil landscapes and deeply rooted spiritual traditions often leave travellers with a renewed sense of balance and inner calm."}],"inclusions":["Handpicked hotels on twin-sharing basis (category flexible to your budget)","Private vehicle with experienced driver for all transfers and sightseeing","Experienced local English/Hindi-speaking guide","Airport / border pick-up and drop","Assistance with Bhutan Entry Permit, SDF payment and documentation","24×7 on-trip support from La Bhutanz Tours"],"exclusions":["Sustainable Development Fee (SDF) — Nu. 1,200 per person per night for Indian citizens (children 6–12 half, under 6 free)","Flights / train fare to and from Bhutan (unless the package says flights are included)","Attraction entrance fees, camera fees and activity costs","Travel insurance (mandatory)","Personal expenses — laundry, beverages, tips and anything not listed in inclusions","Costs from natural calamities, landslides, road blockages or strikes, payable on the spot","5% GST on tour services (if not already included in the quoted price)"],"ideal":["Travellers seeking a peaceful and meaningful escape from busy everyday life.","Guests interested in meditation, mindfulness and spiritual well-being.","Individuals looking for personal rejuvenation and inner reflection.","Couples seeking a slow and serene Himalayan experience.","Wellness travellers interested in monasteries, traditional healing and Bhutanese culture.","Nature lovers who enjoy peaceful valleys, monasteries and gentle nature experiences.","Repeat visitors to Bhutan looking to experience the kingdom from a more spiritual perspective.","Travellers who appreciate slow travel, authentic cultural experiences and meaningful journeys."],"faqs":[{"q":"Is this meditation journey suitable for beginners?","a":"Yes. This journey is designed for travellers seeking peace and mindfulness, whether you have previous meditation experience or are simply looking for a relaxing and spiritually enriching holiday."},{"q":"Will we stay inside monasteries during this tour?","a":"This itinerary primarily includes comfortable hotels and resorts, while selected monastery visits and meditation experiences can be incorporated depending on availability and personal preferences."},{"q":"Can private meditation sessions be arranged?","a":"Yes. Guided meditation sessions with monks or wellness practitioners may be arranged in selected locations, subject to permissions and schedules."},{"q":"Is the Tiger's Nest hike compulsory?","a":"No. The hike is optional. Travellers may choose shorter walks, spend time at the viewpoint café or enjoy a relaxed day in Paro."},{"q":"Is this journey suitable for senior travellers?","a":"Yes. The itinerary follows a slower pace with multiple nights in Paro and Thimphu, making it suitable for senior travellers seeking a peaceful Himalayan experience."},{"q":"Can wellness experiences such as hot stone baths be included?","a":"Absolutely. Traditional Bhutanese hot stone baths, yoga sessions and wellness experiences can be incorporated into the journey upon request."},{"q":"When is the best time to undertake a meditation journey in Bhutan?","a":"Spring (March to May) and Autumn (September to November) offer pleasant weather and beautiful landscapes, although Bhutan's peaceful atmosphere makes this journey enjoyable throughout much of the year."}],"image":"img/photos/monk-sit.jpg","poster":"img/packages/meditation-7n8d-poster.jpg","imageHasTitle":true,"flightIncluded":false,"featured":true,"active":true,"order":6,"priceConfirmed":false},{"id":"explore-10n11d","slug":"explore-10n11d","category":"special","name":"Explore Bhutan","nights":10,"days":11,"price":0,"singleSupplement":0,"stay":"","summary":"Cross the Himalayan heartland to Bumthang, the spiritual centre of the kingdom.","intro":"Bhutan is far more than a destination; it is a journey through ancient monasteries, peaceful valleys, dramatic mountain landscapes and deeply preserved Himalayan traditions. This 10 Nights / 11 Days Explore Bhutan Journey is thoughtfully designed for travellers who wish to experience Bhutan beyond the classic highlights and immerse themselves in both Western and Central Bhutan.\n\nBeginning in the vibrant capital city of Thimphu and the serene valley of Punakha, the journey gradually unfolds into the spiritual heartland of Bumthang, home to some of Bhutan's most sacred temples, traditional villages and rich cultural heritage. The experience concludes with leisurely days in Paro, allowing time to explore iconic landmarks such as Tiger's Nest Monastery and the spectacular landscapes of Chele La Pass.\n\nWith comfortable pacing, extended stays and opportunities to experience Bhutan's authentic culture, spirituality and natural beauty, this itinerary is ideal for travellers seeking a deeper and more meaningful connection with the Kingdom of Bhutan.","highlights":["Experience an immersive journey through both Western and Central Bhutan.","Explore Bhutan's capital city of Thimphu and its important cultural and spiritual landmarks.","Enjoy scenic mountain drives through Dochula Pass, Pele La Pass and Yutong La Pass.","Discover the historic valleys of Punakha and visit the magnificent Punakha Dzong.","Spend three nights in Bumthang, regarded as the spiritual heartland of Bhutan.","Visit ancient monasteries, sacred temples and traditional Bhutanese villages.","Experience the cultural richness of Ura Valley and the beautiful landscapes of Central Bhutan.","Hike to the iconic Tiger's Nest Monastery, Bhutan's most revered pilgrimage site.","Enjoy breathtaking Himalayan scenery from Chele La Pass, the highest motorable road in Bhutan.","Travel at a comfortable pace with extended stays, allowing deeper cultural immersion and meaningful experiences across the kingdom."],"itinerary":[{"title":"Arrive at Paro International Airport","meta":"Transfer to Thimphu (2,350m) · Approx. 65 km · Approx. 2 Hours","desc":"Upon arrival at Paro International Airport, you will be warmly welcomed by your Bhutanese guide and begin your journey towards Thimphu, the charming capital city of Bhutan. The scenic drive follows the Paro and Wang Chhu river valleys, offering beautiful views of traditional villages, forested hills and prayer flags fluttering across the mountains. Upon reaching Thimphu, settle into your hotel and spend the evening exploring the town at a relaxed pace, experiencing Bhutan's unique blend of tradition and modernity. Overnight at Thimphu."},{"title":"Explore Thimphu (2,350m)","meta":"","desc":"Spend the day discovering Bhutan's cultural and spiritual capital. Visit Buddha Dordenma, one of the world's largest seated Buddha statues, offering spectacular views across the valley. Continue to the National Memorial Chorten, an important religious landmark frequented by local devotees. Explore the Folk Heritage Museum, Sangaygang Viewpoint, Changangkha Lhakhang and the Takin Preserve Centre, home to Bhutan's unique national animal. Conclude the day with a visit to the impressive Tashichho Dzong, the administrative and monastic centre of Bhutan. Overnight at Thimphu."},{"title":"Thimphu (2,350m)","meta":"Transfer to Punakha (1,310m) · Approx. 77 km · Approx. 3 Hours","desc":"Leave Thimphu behind and journey towards the beautiful valley of Punakha via Dochula Pass (3,150m). Pause at the pass to enjoy panoramic Himalayan views and the peaceful surroundings of the 108 Druk Wangyal Chortens before continuing towards Punakha. Visit the magnificent Punakha Dzong, one of Bhutan's most beautiful fortresses, situated at the confluence of the Pho Chhu and Mo Chhu rivers. Later, enjoy a short excursion to Chimi Lhakhang, also known as the Temple of Fertility. Spend the evening amidst the serene landscapes of Punakha Valley. Overnight at Punakha."},{"title":"Punakha (1,310m)","meta":"Transfer to Bumthang (2,600m) · Approx. 212 km · Approx. 8 Hours","desc":"Embark on one of Bhutan's most scenic journeys as you travel towards the spiritual heartland of Bumthang. Cross Pele La Pass, traditionally regarded as the boundary between Western and Central Bhutan, and witness the changing landscapes of alpine forests, traditional villages and rolling valleys. Enroute, visit Chendebji Chorten and explore the historic Trongsa Dzong and Ta Dzong, which played an important role in Bhutan's history. Continue over Yutong La Pass before arriving in Bumthang. While passing through Chumey Valley, visit a traditional Yathra weaving centre renowned for its colourful handwoven textiles. Overnight at Bumthang."},{"title":"Explore Bumthang Valley (2,600m)","meta":"","desc":"Spend the day discovering Bhutan's spiritual and cultural heartland. Visit Jakar Dzong, Jambay Lhakhang, Kurjey Lhakhang, Tamshing Lhakhang and other sacred sites that have shaped Bhutan's religious heritage for centuries. Explore traditional villages, ancient monasteries and the beautiful valleys that make Bumthang one of the kingdom's most treasured destinations. Later, visit Mebar Tsho (Burning Lake), one of Bhutan's most sacred pilgrimage sites, and enjoy interactions with local communities and traditional weaving households. Overnight at Bumthang."},{"title":"Excursion to Ura Valley (3,100m)","meta":"Approx. 54 km One Way · Approx. 3 Hours","desc":"Enjoy a scenic excursion to Ura Valley, one of Bhutan's highest and most picturesque villages. Travel through beautiful landscapes and visit Ura Monastery while experiencing the traditional lifestyle and architecture of the region. Spend time strolling through the peaceful village and enjoy the serene atmosphere of Central Bhutan before returning to Bumthang. Later, visit local farms and traditional establishments producing apple juice, cider and cheese. Overnight at Bumthang."},{"title":"Bumthang (2,600m)","meta":"Transfer to Punakha (1,310m) · Approx. 212 km · Approx. 8 Hours","desc":"Begin your return journey towards Western Bhutan, retracing the scenic mountain route through Trongsa and Pele La Pass. Enjoy leisurely stops along the way, taking in Bhutan's ever-changing landscapes and peaceful countryside. Upon arrival in Punakha, spend the remainder of the day relaxing amidst the valley's pleasant climate and tranquil surroundings. Overnight at Punakha."},{"title":"Punakha (1,310m)","meta":"Transfer to Paro (2,280m) · Approx. 140 km · Approx. 5 Hours","desc":"Continue your journey towards the beautiful valley of Paro. Enroute, visit Lamperi and the Royal Botanical Park, home to a rich diversity of Himalayan flora and fauna. Upon arrival in Paro, explore the National Museum housed within Ta Dzong and visit the historic Rinpung Dzong, an architectural masterpiece overlooking the valley. Spend the evening at leisure exploring Paro town. Overnight at Paro."},{"title":"Explore Paro & Excursion to Tiger's Nest Monastery (3,120m)","meta":"","desc":"Embark on one of Bhutan's most memorable experiences with an excursion to the iconic Tiger's Nest Monastery. Perched dramatically on a cliff nearly 900 meters above the valley floor, Taktsang Monastery is Bhutan's most revered pilgrimage site and one of the kingdom's most recognisable landmarks. Later, visit the historic Drukgyel Dzong and Kyichu Lhakhang, one of Bhutan's oldest and most sacred temples, before spending time exploring the beautiful surroundings of Paro Valley. Overnight at Paro."},{"title":"Excursion to Chele La Pass (3,810m)","meta":"Approx. 35 km One Way · Approx. 2 Hours","desc":"Enjoy a scenic drive to Chele La Pass, the highest motorable road in Bhutan. The route passes through beautiful forests of pine, spruce and rhododendron before opening to spectacular panoramic views of the Himalayan mountain ranges and pristine valleys below. On clear days, enjoy breathtaking views of Mount Jomolhari (7,326m), one of Bhutan's most sacred peaks, along with several surrounding Himalayan summits. Spend time amidst fluttering prayer flags, crisp mountain air and the peaceful alpine surroundings before returning to Paro. The remainder of the day may be spent relaxing, exploring Paro town, shopping for local handicrafts or simply enjoying your final evening in the Kingdom of Bhutan. Overnight at Paro."},{"title":"Departure from Paro","meta":"","desc":"Bid farewell to the Kingdom of Bhutan as you transfer to Paro International Airport for your onward journey. As your Explore Bhutan journey comes to an end, take with you unforgettable memories of sacred monasteries, spectacular mountain landscapes, traditional villages and meaningful cultural experiences. From the peaceful valleys of Punakha and Bumthang to the iconic landmarks of Paro, this journey offers a deeper understanding of Bhutan's timeless beauty and enduring traditions."}],"inclusions":["Handpicked hotels on twin-sharing basis (category flexible to your budget)","Private vehicle with experienced driver for all transfers and sightseeing","Experienced local English/Hindi-speaking guide","Airport / border pick-up and drop","Assistance with Bhutan Entry Permit, SDF payment and documentation","24×7 on-trip support from La Bhutanz Tours"],"exclusions":["Sustainable Development Fee (SDF) — Nu. 1,200 per person per night for Indian citizens (children 6–12 half, under 6 free)","Flights / train fare to and from Bhutan (unless the package says flights are included)","Attraction entrance fees, camera fees and activity costs","Travel insurance (mandatory)","Personal expenses — laundry, beverages, tips and anything not listed in inclusions","Costs from natural calamities, landslides, road blockages or strikes, payable on the spot","5% GST on tour services (if not already included in the quoted price)"],"ideal":["First-time visitors seeking a comprehensive Bhutan experience.","Travellers interested in exploring both Western and Central Bhutan.","Families looking for a slow-paced and immersive Himalayan journey.","Couples seeking scenic landscapes, cultural experiences and peaceful valleys.","Culture enthusiasts interested in monasteries, traditional villages and Bhutanese heritage.","Spiritual travellers wishing to visit some of Bhutan's most sacred temples and pilgrimage sites.","Nature lovers who enjoy mountain scenery, forests, valleys and picturesque drives.","Photography enthusiasts seeking diverse landscapes and authentic cultural experiences.","Premium travellers who prefer longer stays and meaningful experiences rather than rushed sightseeing.","Repeat visitors looking to discover the lesser-explored regions of Bumthang and Central Bhutan."],"faqs":[{"q":"Is 10 Nights / 11 Days enough to explore Bhutan properly?","a":"Yes. This itinerary offers a well-paced journey covering both Western and Central Bhutan, including Thimphu, Punakha, Bumthang and Paro, allowing travellers to experience Bhutan beyond the usual highlights."},{"q":"Why does this itinerary include three nights in Bumthang?","a":"Bumthang is regarded as the spiritual heartland of Bhutan and is home to some of the kingdom's oldest monasteries, sacred temples and traditional villages. The extended stay allows for a deeper and more immersive experience."},{"q":"Is the drive to Bumthang very long?","a":"The journey to Bumthang involves scenic mountain drives through Central Bhutan. While the drive is longer than Western Bhutan routes, the landscapes, mountain passes and cultural experiences make it one of Bhutan's most rewarding journeys."},{"q":"Is the Tiger's Nest hike suitable for all travellers?","a":"The hike requires a moderate level of fitness and can be completed at a comfortable pace. Travellers who prefer not to undertake the full hike may visit the viewpoint café or enjoy leisure time in Paro."},{"q":"What is the best time to undertake this journey?","a":"Spring (March to May) and Autumn (September to November) are considered the best seasons, offering pleasant weather, clear Himalayan views and vibrant landscapes. However, the itinerary can be enjoyed throughout much of the year."},{"q":"Is this itinerary suitable for senior travellers?","a":"Yes. The journey follows a comfortable pace with multiple-night stays and avoids excessively rushed travel, making it suitable for senior travellers seeking a deeper Bhutan experience."},{"q":"Can this itinerary be customised?","a":"Absolutely. Additional experiences such as wellness activities, village experiences, festivals, photography opportunities and luxury stays can be incorporated according to your travel preferences."},{"q":"What makes this itinerary different from shorter Bhutan tours?","a":"Unlike shorter itineraries that focus mainly on Paro, Thimphu and Punakha, this journey extends into Central Bhutan and offers a deeper understanding of Bhutan's spiritual heritage, traditional lifestyles and diverse landscapes."},{"q":"Is this journey suitable for families and couples?","a":"Yes. This itinerary is ideal for families, couples and travellers seeking a meaningful Himalayan journey with a balanced combination of culture, spirituality, nature and relaxation."}],"image":"img/photos/dzong-river.jpg","poster":"img/packages/explore-10n11d-poster.jpg","imageHasTitle":true,"flightIncluded":false,"featured":true,"active":true,"order":7,"priceConfirmed":false},{"id":"photography-12n13d","slug":"photography-12n13d","category":"special","name":"Photography Tour","nights":12,"days":13,"price":0,"singleSupplement":0,"stay":"","summary":"A west-to-east crossing of Bhutan for landscapes, festivals, wildlife and village life.","intro":"Paro 4N | Thimphu 1N | Gangtey 1N | Bumthang 2N | Mongar 1N | Trashiyangtse 1N | Trashigang 1N | Samdrupjongkhar 1N\n\nBhutan is one of the few destinations in the Himalayas where photography extends far beyond landscapes. From ancient monasteries perched on cliffs and pristine valleys filled with prayer flags to remote eastern villages preserving centuries-old traditions, every region offers unique visual stories waiting to be captured.\n\nThis 12 Nights / 13 Days Photography Journey has been thoughtfully designed for travellers, photography enthusiasts and visual storytellers seeking a deeper exploration of Bhutan. The journey gradually unfolds from the western valleys of Paro and Thimphu to the lesser-visited regions of Eastern Bhutan, offering opportunities to photograph dramatic mountain scenery, traditional architecture, local communities, monasteries, village life, festivals (seasonal), wildlife and everyday moments that define Bhutan's unique identity.","highlights":["Experience an immersive photography journey across both Western and Eastern Bhutan.","Capture Bhutan's dramatic mountain landscapes, ancient monasteries and traditional architecture.","Enjoy extended stays in Paro with opportunities for sunrise, sunset and cultural photography.","Photograph the iconic Tiger's Nest Monastery and the panoramic landscapes of Chele La Pass.","Explore the pristine valleys of Gangtey and Bumthang, renowned for their scenic beauty and cultural heritage.","Discover remote regions of Mongar, Trashiyangtse and Trashigang, offering authentic village and lifestyle photography.","Experience changing landscapes as you travel through forests, mountain passes, river valleys and traditional settlements.","Capture Bhutan's unique traditions, local communities, festivals (seasonal) and everyday moments.","Enjoy a slower and more immersive journey, allowing ample time for meaningful photography experiences.","Travel comfortably with a private vehicle, experienced local guide and personalised assistance throughout your Bhutan journey."],"itinerary":[{"title":"Arrive at Paro International Airport","meta":"Explore Paro Valley (2,280m)","desc":"As your flight approaches Paro, enjoy spectacular aerial views of the Eastern Himalayas, including the sacred peaks of Mount Jomolhari and Jichu Drake. Upon arrival at Paro International Airport, you will be warmly welcomed by your Bhutanese guide. After completing arrival formalities and discussing your photography journey, spend the afternoon exploring Paro Valley. Depending on arrival time, enjoy introductory photography sessions around traditional Bhutanese architecture, local settlements and the beautiful Paro landscape. Overnight at Paro."},{"title":"Explore Paro Valley (2,280m)","meta":"","desc":"After breakfast, visit the historic ruins of Drukgyel Dzong, once a strategic fortress that commemorates Bhutan's victory over Tibetan invasions. On clear days, enjoy magnificent views of Mount Jomolhari (7,329m), one of Bhutan's most sacred mountains. Continue to Kyichu Lhakhang, one of Bhutan's oldest and holiest temples, built in the 7th century by Tibetan King Songtsen Gampo. Later, visit the National Museum, which houses an impressive collection of Bhutanese cultural artefacts and offers excellent opportunities for architectural photography. Conclude the day with a visit to Rinpung Dzong and a leisurely walk through Paro town, capturing traditional Bhutanese life and the iconic wooden cantilever bridge. Overnight at Paro."},{"title":"Excursion to Tiger's Nest Monastery (Taktsang Monastery) (3,120m)","meta":"","desc":"Today embark on one of Bhutan's most rewarding experiences as you hike to the iconic Tiger's Nest Monastery. Perched dramatically on a cliff approximately 900 metres above the Paro Valley, this sacred monastery is one of Bhutan's most revered pilgrimage sites. According to legend, Guru Rinpoche arrived here on the back of a flying tigress and meditated in a cave, giving the monastery its name. The hike offers exceptional opportunities for landscape and monastery photography. Enjoy a picnic lunch at the Taktsang Cafeteria overlooking the monastery and surrounding valley. The round hike generally takes around 4–5 hours. Overnight at Paro."},{"title":"Excursion to Haa Valley via Chele La Pass (3,822m)","meta":"","desc":"Rise early for a scenic excursion to the beautiful Haa Valley via Chele La Pass, Bhutan's highest motorable pass. Drive through dense forests of pine and rhododendron while enjoying magnificent panoramic views of the Himalayan mountain ranges. Chele La offers exceptional sunrise and landscape photography opportunities. Continue towards the peaceful Haa Valley, known for its pristine landscapes, traditional villages and untouched Bhutanese charm. Enjoy a picnic lunch before returning to Paro. En route, visit the peaceful Chele La Nunnery and capture the stunning mountain scenery. Overnight at Paro."},{"title":"Paro (2,280m)","meta":"Transfer to Thimphu (2,334m) · Approx. 55 km · Approx. 1.5 Hours","desc":"After breakfast, drive to Bhutan's capital city, Thimphu. En route, visit Simtokha Dzong, one of the oldest fortresses in Bhutan, built in 1629 and presently home to one of the country's premier monastic institutions. Upon arrival in Thimphu, visit the impressive Tashichho Dzong, which houses the King's office, government ministries and the central monastic body. Later, visit the Memorial Chorten, built in memory of the Third King of Bhutan. Continue to Sangaygang View Point for panoramic views of Thimphu Valley and visit the Zilukha Nunnery. You may also explore the Traditional Arts and Crafts School and local handicraft centres, offering excellent opportunities for cultural and documentary photography. Overnight at Thimphu."},{"title":"Thimphu (2,334m)","meta":"Transfer to Gangtey Valley (3,000m) · Approx. 135 km · Approx. 5–6 Hours","desc":"After breakfast, begin your scenic drive towards the beautiful Gangtey Valley via Dochula Pass (3,150m). Stop at Dochula Pass to photograph the iconic 108 Druk Wangyal Chortens and, weather permitting, enjoy spectacular views of the snow-capped Eastern Himalayan mountain ranges. Continue your journey through changing landscapes as the road descends into subtropical valleys before climbing towards the pristine Phobjikha Valley. Gangtey Valley is renowned for its wide glacial landscapes, traditional villages and, during winter months, the endangered Black-Necked Cranes. Enjoy the peaceful surroundings and capture the valley's unique natural beauty. Overnight at Gangtey."},{"title":"Gangtey Valley (3,000m)","meta":"Transfer to Bumthang (2,600m) · Approx. 180 km · Approx. 6–7 Hours","desc":"This morning, continue your journey towards Bumthang via Trongsa. Enroute, visit Chendebji Chorten, an important stupa built in the 18th century and inspired by Nepal's Swayambhunath Stupa. Proceed to visit the magnificent Trongsa Dzong, one of Bhutan's most historically significant fortresses and the ancestral home of Bhutan's Royal Family. Continue your drive across scenic mountain passes and forested landscapes before arriving in Bumthang, often regarded as the cultural and spiritual heartland of Bhutan. Later, visit Jakar Dzong, Jambay Lhakhang and local handicraft centres, offering wonderful opportunities to photograph Bhutan's traditional architecture and cultural heritage. Overnight at Bumthang."},{"title":"Explore Bumthang Valley (2,600m)","meta":"","desc":"After breakfast, enjoy a full day exploring the cultural treasures of Bumthang Valley. Visit Chakhar Lhakhang, the site associated with the ancient palace of Sindhu Raja, followed by Kurjey Lhakhang, one of Bhutan's most sacred monasteries. Continue to Tamshing Lhakhang, one of the kingdom's most important Nyingma monasteries, known for its ancient murals and spiritual significance. Later, visit Mebar Tsho, popularly known as the Burning Lake, one of Bhutan's most sacred pilgrimage sites and an excellent location for landscape and spiritual photography. Spend the evening exploring local markets and traditional settlements around Bumthang. Overnight at Bumthang."},{"title":"Bumthang (2,600m)","meta":"Transfer to Mongar (1,700m) · Approx. 200 km · Approx. 7–8 Hours","desc":"After breakfast, begin one of Bhutan's most scenic drives towards Eastern Bhutan. Enroute, visit Ura Valley, one of the most picturesque valleys in Bhutan, known for its traditional stone houses and peaceful rural landscapes. Continue the journey across Thrumshing La Pass (3,750m), the highest mountain pass on the Lateral East-West Highway, offering exceptional opportunities for mountain and landscape photography. As the road gradually descends, witness dramatic changes in vegetation and scenery before arriving in Mongar. If time permits, visit a traditional farmhouse in Sengor Village and experience authentic rural Bhutanese life. Overnight at Mongar."},{"title":"Mongar (1,700m)","meta":"Transfer to Trashiyangtse (1,850m) · Approx. 170 km · Approx. 6–7 Hours","desc":"After breakfast, drive further east through beautiful mountain landscapes and subtropical valleys. Pass through Lingmethang and other picturesque settlements while enjoying changing scenery and opportunities for documentary and landscape photography. Continue towards Trashiyangtse, one of Bhutan's least-visited regions, known for its peaceful environment, traditional craftsmanship and rich cultural heritage. Depending on arrival time, explore the town and surrounding landscapes. Overnight at Trashiyangtse."},{"title":"Trashiyangtse (1,850m)","meta":"Excursion & Transfer to Trashigang (1,150m) · Approx. 55 km · Approx. 2 Hours","desc":"This morning, visit the famous Gomphu Kora Monastery, one of Eastern Bhutan's most important pilgrimage sites associated with Guru Rinpoche. Continue to Chorten Kora, one of Bhutan's most significant stupas, where annual religious festivals attract devotees from Bhutan and neighbouring Arunachal Pradesh in India. Enjoy photography opportunities around the numerous prayer wheels, traditional villages and local communities. Later, drive towards Trashigang, the commercial and cultural centre of Eastern Bhutan. Overnight at Trashigang."},{"title":"Trashigang (1,150m)","meta":"Transfer to Samdrupjongkhar (250m) · Approx. 180 km · Approx. 6–7 Hours","desc":"After breakfast, begin your scenic descent towards Samdrupjongkhar. The journey offers excellent opportunities to photograph changing landscapes as you descend from the cool mountain regions into subtropical forests and lower valleys. Enroute, make several photography stops to capture rural life, traditional settlements and the diverse natural scenery of Eastern Bhutan. Arrive in Samdrupjongkhar by evening and enjoy your final night in Bhutan. Overnight at Samdrupjongkhar."},{"title":"Departure from Samdrupjongkhar","meta":"","desc":"After breakfast, bid farewell to your Bhutanese hosts and conclude your memorable photography journey through the Kingdom of Bhutan. Depart with unforgettable memories and a remarkable collection of photographs capturing Bhutan's landscapes, culture, monasteries and unique way of life."}],"inclusions":["Handpicked hotels on twin-sharing basis (category flexible to your budget)","Private vehicle with experienced driver for all transfers and sightseeing","Experienced local English/Hindi-speaking guide","Airport / border pick-up and drop","Assistance with Bhutan Entry Permit, SDF payment and documentation","24×7 on-trip support from La Bhutanz Tours"],"exclusions":["Sustainable Development Fee (SDF) — Nu. 1,200 per person per night for Indian citizens (children 6–12 half, under 6 free)","Flights / train fare to and from Bhutan (unless the package says flights are included)","Attraction entrance fees, camera fees and activity costs","Travel insurance (mandatory)","Personal expenses — laundry, beverages, tips and anything not listed in inclusions","Costs from natural calamities, landslides, road blockages or strikes, payable on the spot","5% GST on tour services (if not already included in the quoted price)"],"ideal":["Photography enthusiasts looking to explore both Western and Eastern Bhutan.","Travellers interested in landscape photography, mountain scenery and Himalayan vistas.","Guests who enjoy documenting traditional lifestyles, monasteries and local communities.","Nature lovers seeking opportunities to photograph forests, valleys, rivers and seasonal wildlife.","Repeat visitors wishing to discover Bhutan's lesser-explored eastern regions.","Travellers who prefer slower and more immersive journeys with ample time for photography.","Small photography groups, clubs and travellers seeking meaningful cultural experiences.","Guests looking for a unique combination of culture, spirituality, landscapes and authentic Himalayan experiences."],"faqs":[{"q":"Is this photography tour suitable for beginners?","a":"Yes. This journey is suitable for both amateur and professional photographers. The itinerary offers ample time for landscapes, cultural experiences and relaxed photography sessions."},{"q":"Which type of photography can be experienced during this journey?","a":"This tour is ideal for landscape, cultural, architectural, monastery, village life, wildlife and documentary photography."},{"q":"When is the best time for a Bhutan photography tour?","a":"Spring (March to May) and autumn (September to November) are considered the best seasons due to clear mountain views, pleasant weather and vibrant landscapes."},{"q":"Can this itinerary be customised based on photography interests?","a":"Yes. The itinerary can be personalised depending on your interests such as festivals, bird photography, landscapes, monasteries or cultural experiences."},{"q":"Will there be opportunities for sunrise and sunset photography?","a":"Yes. Destinations such as Paro, Chele La Pass, Gangtey Valley and Bumthang offer excellent sunrise and sunset photography opportunities."},{"q":"Is this journey suitable for photography groups and clubs?","a":"Absolutely. This itinerary is ideal for photography clubs, special interest groups and travellers seeking immersive photography experiences."},{"q":"Are there opportunities to photograph local culture and traditional lifestyles?","a":"Yes. The journey includes visits to traditional villages and lesser-explored regions of Eastern Bhutan, providing excellent opportunities to capture authentic Bhutanese life."},{"q":"Can seasonal festivals be included in this photography itinerary?","a":"Yes. Depending on travel dates, various Bhutanese festivals can be incorporated into the itinerary for unique cultural photography experiences."},{"q":"Why does this journey include Eastern Bhutan?","a":"Eastern Bhutan offers remote landscapes, traditional settlements and authentic cultural experiences that remain largely untouched by mainstream tourism, making it ideal for photography enthusiasts."}],"image":"img/photos/mask.jpg","poster":"img/packages/photography-12n13d-poster.jpg","imageHasTitle":true,"flightIncluded":false,"featured":false,"active":true,"order":8,"priceConfirmed":false},{"id":"last-shangri-la-9n10d","slug":"last-shangri-la-9n10d","category":"fixed","name":"The Last Shangri-La","nights":9,"days":10,"price":0,"singleSupplement":0,"stay":"","summary":"Group fixed departure from Mumbai with return flights, hot-stone bath, pure-veg & Jain food and a female guide.","intro":"A scheduled group departure from Mumbai with return flights included. Travel with fellow guests, enjoy pure-vegetarian and Jain meals throughout, and let us take care of every detail — from permits to hotels to a female tour guide.","highlights":["Mumbai – Paro – Mumbai return flights included","Standard 4-star hotels","Pure-veg & Jain meals throughout","One-time Bhutanese hot-stone bath","Conducted by a female guide","Fixed dates with limited seats"],"itinerary":[{"title":"Arrive Paro Airport – Thimphu","meta":"","desc":"(distance: 65 kms. / driving time: 2 hrs. / altitude of Thimphu: 2350 mts.) Meet and greet On Arrival at Paro Airport and Transfer to Thimphu, The Capital city of Bhutan. On Arrival check In at The Hotel. In evening Visit Tashichhoe Dzong , And Explore The Thimphu Town By Walk . Overnight Stay At Thimphu. (L, D,)"},{"title":"Thimphu Sightseeing","meta":"","desc":"After Breakfast Visit Kuensel Phodrang (Buddha Statue ), National Memorial Chorten (Monument) And Folk Heritage Museum . Afternoon Visit, Changangkha Monastery , Talking Preserve Centre , The talking National animal of Bhutan Can be seen here. Dinner & Overnight stay at Thimphu. (B,L,D)"},{"title":"Thimphu - Punakha","meta":"","desc":"(distance: 77 kms. / driving time: 3 hrs. / altitude of Punakha: 1310 mts.) After breakfast Drive to Punakha / Wangdue, On The Way stop at Dochu-La-Pass (3150 mts.). To View The higher Himalayas. Arrival at Punakha check In at Hotel. After noon Visit Punakha Dzong - built In 1637 by zhabdrung ngawang namgyal. For many years until The time of The second King, It served as The seat of The government. The Dzong was named Druk pungthang dechen phodrang (palace of great happiness). Punakha Is still The winter residence of je-khenpo and King jigme dorji wangchuck convened The first National assembly here In 1952. After that take A short and easy hike to Visit The Chhimi Lhakhang - The Temple, also known as “The Temple of Fertility” was built by lama drukpa kuenley, “The devine mad man”. Evening free For leisure. Overnight stay at Punakha. (B,L,D)"},{"title":"Punakha – Bumthang","meta":"","desc":"After breakfast check Out From Hotel and Drive to Trongsa across Pele-La-Pass (11.120 ft.) Traditional boundary between east & west Bhutan, there Is an adrupt change In vegetation, With mountain forest replaced by high altitude dwarf bamboo. Stop enroute Chendbji Chorten - built In The style of The great bodhanath choten of nepal. Further ahead Visit Trongsa Dzong – It was The seat of power over Central & Eastern Bhutan and Ta Dzong - an ancient watch Tower. The chapel inside Is said to be dedicated to The Trongsa penlop jigme namgyal. Then Drive further to Bumthang over The Yutong-La-Pass (11,155 ft.). While In Chumey Valley In Bumthang, Visit The Yathra Weaving Factory - It Is The most famous Textile product of Bumthang. On Arrival check In at The Hotel. Overnight stay at Bumthang. (B,L,D)"},{"title":"Bumthang Sightseeing","meta":"","desc":"After breakfast, 1st half Visit Jakar Dzong : literally meaning The castle of white bird. The current structure was built In 1667. Lamey goemba: A large palace and Monastery built In 18th century by dasho phuntsho wangdi Jambay Lhakhang : built by King srongsen Gampo of Tibet. In october One of The most spectacular festival, “Jambay Lhakhang drup” Is staged here. Chakhar Lhakhang : literally meaning The iron castle, The original palace was made of iron and hence The name “Chakhar”. Kurjey Lhakhang : named After body print of Guru rimpoche. Afternoon 2nd half Visit Tamshing Lhakhang : literally meaning The Temple of The good message, established In 1501 by pema lingpa. Membarstho : literally meaning, “The Burning Lake”. The evening Ends Visit A local handloom weaving house and interact With The weavers. Overnight stay at Bumthang. (B,L,D)"},{"title":"Bumthang – Gangtey","meta":"","desc":"(distance: 2000 kms. / driving time: 8 hrs. Altitude of punakha/wangdue 1200mts) After breakfast, Drive to Gangtey (3000mts.). Gangtey Is The home of black necked crane Which migrates From The arid plains of Tibet In The north. It Is A beautiful Valley of Bhutan. You Can also Visit Gangtey Gompha. Evening leisure. Dinner & Overnight stay Gangtey (B,L,D)"},{"title":"Gangtey","meta":"","desc":"After breakfast Drive to Paro and On The Way Visit near River side and, Airport View\" evening leisure. Visit near, Ta Dzong – National Museum With an excellent collection of Arts, relics, religious thangka. Rinpung Dzong, Meaning \"fortress of The heap of jewels Visit Museum Of Lights (to display The country’s Journey before The Arrival of electricity and The present)\" evening leisure. Dinner & Overnight stay at Paro. (B,L,D)"},{"title":"Paro Sightseeing","meta":"","desc":"(distance: 35 kms. One Way / driving time: 2 hrs. / altitude of chele-la-pass: 3810 mts.) After breakfast hike to The famous Taktsang Monastery - called “Tiger’s Nest” (2hrs hike From The base camp). Later Visit Drukgyel Dzong & Kyichu Monastery . Overnight Stay At Paro. (B,L,D)"},{"title":"Excursion To Chele-La-Pass","meta":"","desc":"After breakfast Excursion trip to Chele-La-Pass (13,088 ft.) – The highest motorable road In Bhutan. Enjoy The scenic beauty & memorable landscapes From chele-la-pass. Back to Paro. Rest of The day Is free For leisure. Overnight stay at Paro. (B,L,D)"},{"title":"Paro Airport : services Ends.","meta":"","desc":"With A final tashi delek,\" Your Bhutanese sojourn has come to an end, but The Memories you've made will Last A lifetime. We are honored to have been A part of Your Journey and hope you will cherish The moments spent exploring This enchanting Kingdom.\" (B) (tashi delek means “all good things comes to you”) Must-See Sightseeing THIMPU Tashichhoe Dzong | thimpu town chowk (clock Tower) | kuensel phodrang | National Memorial Chorten | Simply Bhutan Museum | Folk Heritage Museum | Changangkha Monastery | dochu-la-pass PUNAKHA Chhimi Lhakhang | pele-la-pass | Punakha Dzong | Kyichu lakhang | chendbji Chorten Trongsa Dzong | Ta Dzong BUMTHANG Yutong-la-pass | Yathra weaving Factory | Jakar Dzong | Jambay Lhakhang | Tamshing Lhakhang | membarstho GANGTEY (PHOBJIKHA) Gangtey Gompha PARO Rinpung Dzong | Museum of lights | Taktsang Monastery (tiger’s Nest) | Drukgyel Dzong Haa valley | chele-la- Pass | Paro Museum Handpicked Hotels / Resorts Standard 4 Star Hotels Thimpu : Pelyang boutique / ramada / Hotel osel Punakha : Khuru Resort / Zhingkham Resort Bumthang : Yu-Gharling Resort & Spa / Swiss guest house Bumthang Gangtey : Dewachen Hotel & Spa Paro : Hotel Paro grand / Hotel golden paddy field / metta resorts & spa Kindly Note: Hotels May vary as per rooms availability."}],"inclusions":["Mumbai – Paro – Mumbai return flight ticket","All accommodation in standard 4-star hotels","Only pure-veg and Jain food served","Daily breakfast, lunch (in pure-veg restaurants) and dinner in the hotels","Snacks / munching on the route and during sightseeing","Daily 1-litre mineral water bottle per person","One-time traditional Bhutanese hot-stone bath","All transfers and sightseeing by a well-maintained coaster","Tour conducted by a female guide"],"exclusions":["Attraction entrance fee, camera fees, activity cost","Personal expenses (laun its Visit Drukgyel Dzong . Overnight stay will be at Paro. OR After Breakfast Drive To Sangchen chokor Monastery For Paro Valley View and Temple . Back To Paro. And Evening try Bhutanese Traditional Dress And Shopping At Town . Overnight Stay At Paro"},{"title":"Paro Airport","meta":"","desc":"After breakfast check Out From Hotel and drop at Paro Airport For Departure. Must See Sightseeeing THIMPU Tashichhoe Dzong | thimpu town chowk (clock Tower) | kuensel phodrang | National Memorial Chorten | Simply Bhutan Museum | Folk Heritage Museum | Changangkha Monastery | dochu-la-pass PUNAKHA Chhimi Lhakhang | pele-la-pass | Punakha Dzong | Kyichu lakhang | chendbji Chorten Trongsa Dzong | Ta Dzong GANGTEY (PHOBJIKHA) Gangtey Gompha PARO Rinpung Dzong | Museum of lights | Taktsang Monastery (tiger’s Nest) | Drukgyel Dzong Haa valley | chele-la- Pass | Paro Museum Handpicked Hotels/ Resorts Standard 4 Star Hotels Thimpu : Pelyang / tashi yid wong / Hotel osel Punakha : Khuru resorts / meri phuensume Gangtey : Dewachen resorts / Phobjikha resorts Paro : Hotel Paro grand / Hotel golden paddy field / metta resorts & spa Kindly Note: Hotels May vary as per rooms availability."}],"inclusions":["Mumbai – Paro – Mumbai return flight ticket","All accommodation in standard 4-star hotels","Only pure-veg and Jain food served","Daily breakfast, lunch (in pure-veg restaurants) and dinner in the hotels","Snacks / munching on the route and during sightseeing","Daily 1-litre mineral water bottle per person","One-time traditional Bhutanese hot-stone bath","All transfers and sightseeing by a well-maintained coaster","Tour conducted by a female guide"],"exclusions":["Attraction entrance fee, camera fees, activity cost","Personal expenses (laundry, beverages, tips, etc.)","Additional sightseeing or extra use of vehicle other than in the itinerary","Costs from natural calamities, landslides, road blockages or strikes, payable on the spot","Sustainable Development Fee (SDF) and Bhutan Entry Perm
