 of the country.<\/p>\n<p>Bhutan is home to diverse wildlife, including the takin, red panda, Himalayan black bear, clouded leopard, snow leopard, Bengal tiger, golden langur and several species of deer.<\/p>\n<p>The country is also an important destination for birdlife. Black-necked cranes migrate to the Phobjikha and Bumdeling valleys during winter, while hornbills, Himalayan monals, ravens and numerous other species can be observed across different regions.<\/p>\n<p>Travellers can experience Bhutan’s natural heritage through forest walks, birdwatching, wildlife excursions, river valleys, mountain passes and community-based nature experiences.<\/p>\n<p>Visitors should avoid disturbing wildlife, removing plants, leaving litter or walking outside designated trails. Responsible behaviour helps protect Bhutan’s fragile ecosystems and supports the communities that depend on them.<\/p>\n<h3>Weather and Climate in Bhutan<\/h3>\n<p>Bhutan’s climate varies significantly according to altitude, location and season. Travellers may experience subtropical conditions in the southern foothills, temperate weather in the central valleys and much colder alpine conditions in the higher Himalayan regions.<\/p>\n<h3>Spring – March to May<\/h3>\n<p>Spring generally brings pleasant temperatures, flowering trees, rhododendrons and increasingly green landscapes. It is a popular season for cultural sightseeing, photography, nature walks and trekking.<\/p>\n<h3>Summer and monsoon – june to September<\/h3>\n<p>Summer is warmer and greener, with rainfall influenced by the Indian monsoon. Rain is generally heavier in the southern regions, while central valleys often experience showers followed by clearer periods. Travellers should expect occasional road delays and carry suitable rain protection.<\/p>\n<h3>Autumn – late September to November<\/h3>\n<p>Autumn usually offers clear skies, comfortable daytime temperatures and excellent visibility of the Himalayan ranges. It is also an important season for festivals, trekking and cultural journeys.<\/p>\n<h3>Winter – December to February<\/h3>\n<p>Winter is generally dry, crisp and sunny, although mornings and evenings can be cold. Snowfall is possible at higher elevations and mountain passes, while valleys such as Punakha and Phuentsholing remain comparatively warmer.<\/p>\n<p>Because weather can change quickly in mountainous regions, travellers should carry layers throughout the year. Conditions may differ significantly between Paro, Thimphu, Punakha, Gangtey and Bumthang during the same journey.<\/p>\n<h3>Festivals and Traditional Celebrations<\/h3>\n<p>Bhutan’s festivals are among the most meaningful ways to experience the country’s living culture, spiritual traditions and community life.<\/p>\n<p>The best-known celebrations are tshechus, annual religious festivals held in different districts, monasteries and dzongs across Bhutan. The word tshechu refers to the tenth day of a month in the Bhutanese lunar calendar, traditionally associated with Guru Rinpoche.<\/p>\n<p>Tshechus usually feature sacred masked dances, traditional music, religious ceremonies, colourful costumes and community gatherings. For Bhutanese families, these festivals are occasions to receive blessings, reconnect with relatives and celebrate their shared cultural heritage.<\/p>\n<p>Some of Bhutan’s best-known festivals include:<\/p>\n<ul>\n<li>Paro Tshechu<\/li>\n<li>Thimphu Tshechu<\/li>\n<li>Punakha Drubchen and Tshechu<\/li>\n<li>Trongsa Tshechu<\/li>\n<li>Jambay Lhakhang Drup in Bumthang<\/li>\n<li>Black-Necked Crane Festival in Phobjikha Valley<\/li>\n<li>Royal Highland Festival in Laya<\/li>\n<\/ul>\n<p>Festival dates are generally determined according to the Bhutanese lunar calendar and may change from year to year. Travellers should therefore confirm the official dates before arranging flights, accommodation or a festival-focused itinerary.<\/p>\n<p>Visitors should dress respectfully, avoid blocking local participants, ask permission before photographing people and follow any instructions given by monks, guides or festival organisers.<\/p>\n<p>A Bhutan festival journey is most rewarding when there is enough time to experience the destination beyond the main performance, including its monasteries, villages, landscapes and local communities.<\/p>\n<h3>Currency and Payments in Bhutan<\/h3>\n<p>The official currency of Bhutan is the Bhutanese Ngultrum, abbreviated as BTN or written locally as Nu.<\/p>\n<p>The Ngultrum is maintained at equal value with the Indian Rupee. Indian Rupees are widely accepted in Bhutan, although travellers should carry a practical combination of local currency, Indian Rupees and payment cards rather than relying on a single payment method.<\/p>\n<p>Currency can be exchanged at Paro International Airport, authorised exchange counters, banks and selected larger hotels.<\/p>\n<p>Visa and Mastercard are accepted at many hotels, restaurants and shops in major towns such as Paro and Thimphu. However, card acceptance may be limited in smaller towns, rural areas and local markets.<\/p>\n<p>ATMs are available in major towns, but international cards may not work consistently. Travellers should inform their bank before departure, activate international transactions and check withdrawal limits.<\/p>\n<p>Digital payment services are increasingly available in Bhutan, but visitors should still carry sufficient cash for small purchases, tips, rural stops and unexpected payment issues.<\/p>\n<p>Exchange rates and payment arrangements can change. Travellers should confirm current banking and currency guidance before beginning their journey.<\/p>\n<h3>What to Pack for Bhutan<\/h3>\n<p>Packing for Bhutan depends on the season, altitude and regions included in your itinerary. Because temperatures can change considerably between daytime and evening, layered clothing is useful throughout the year.<\/p>\n<p>Recommended clothing and essentials include:<\/p>\n<ul>\n<li>Comfortable walking shoes with good grip<\/li>\n<li>Lightweight clothing for warmer daytime conditions<\/li>\n<li>A warm jacket, fleece or jumper for mornings and evenings<\/li>\n<li>Waterproof or wind-resistant outerwear<\/li>\n<li>Modest clothing for monasteries, temples and dzongs<\/li>\n<li>Sunglasses, sunscreen and a reusable water bottle<\/li>\n<li>Hat, gloves and thermal layers for winter or high-altitude journeys<\/li>\n<li>Personal medication and a small basic travel kit<\/li>\n<li>Rain protection during the summer and monsoon season<\/li>\n<li>A universal travel adapter and portable power bank<\/li>\n<\/ul>\n<p>Travellers visiting religious sites should wear clothing that covers the shoulders and knees. Comfortable trousers, long skirts and layered tops are generally practical for both sightseeing and cultural visits.<\/p>\n<p>Those travelling to higher places such as Chele La, Dochula, Gangtey or Bumthang should carry additional warm layers even during otherwise pleasant seasons.<\/p>\n<p>Avoid overpacking. Bhutan journeys often involve changing hotels and travelling through mountain roads, so manageable luggage is more convenient.<\/p>\n<h3>Planning Your Bhutan Journey<\/h3>\n<p>Read our complete What to Pack for Bhutan guide for seasonal clothing, footwear and essential travel items.<\/p>\n<p>Google Sites<\/p>\n<p>Report abuse<\/p>\n<p>Page details<\/p>\n<p>Page updated<\/p>\n<p>Google Sites<\/p>\n<p>Report abuse<\/p>","published":true},{"id":"pg-dos-and-donts","slug":"dos-and-donts","title":"Bhutan Travel Do's & Don'ts","html":"<p>Bhutan travel do’s and don’ts<\/p>\n<p>Bhutan is known for its deep spiritual traditions, welcoming communities and strong respect for nature. Travellers can enjoy a more meaningful journey by understanding a few local customs before they arrive.<\/p>\n<p>These practical guidelines explain how to behave respectfully at religious sites, interact with local people, take photographs responsibly and protect Bhutan’s natural environment.<\/p>\n<p>Most customs are simple and your guide will help whenever local guidance is needed. A thoughtful and respectful approach is always appreciated.<\/p>\n<h3>Respectful Cultural Etiquette<\/h3>\n<p>Bhutanese culture places great importance on courtesy, modesty and respect for others.<\/p>\n<p>Dress neatly when visiting public places, religious sites and government buildings. Clothing that covers the shoulders and knees is the most appropriate choice.<\/p>\n<p>Use a calm and polite manner when speaking with local people. Public arguments, loud behaviour and disrespectful gestures are best avoided.<\/p>\n<p>Ask before touching personal belongings, religious objects or ceremonial items.<\/p>\n<p>When giving or receiving something, using both hands is considered respectful.<\/p>\n<p>Your guide will explain local customs when needed. Travellers are not expected to know every tradition, but a sincere and respectful attitude is always valued.<\/p>\n<h3>Temple and Monastery Etiquette<\/h3>\n<p>Bhutan’s temples, monasteries and dzongs are active places of worship. Visitors should enter them with care and respect.<\/p>\n<p>Remove hats and sunglasses before entering prayer halls or inner religious spaces.<\/p>\n<p>Walk clockwise around chortens, temples, prayer wheels and other sacred structures unless local guidance says otherwise.<\/p>\n<p>Do not point your feet towards altars, sacred images or monks. Avoid sitting on religious platforms, mani stones or ceremonial objects.<\/p>\n<p>Photography may be restricted inside certain temples and prayer halls. Always follow signs and ask your guide before taking photographs.<\/p>\n<p>Keep your voice low during prayers and ceremonies. Mobile phones should remain silent.<\/p>\n<p>Some areas may not be open to visitors. Respect any barriers or instructions given by monks, caretakers or your guide.<\/p>\n<h3>Photography and Privacy<\/h3>\n<p>Bhutan offers many beautiful moments to photograph, but privacy and local customs should always come first.<\/p>\n<p>Ask permission before photographing monks, children, local families or anyone at close range.<\/p>\n<p>Do not photograph inside temples, prayer halls or restricted religious spaces unless your guide confirms that it is allowed.<\/p>\n<p>Avoid blocking pathways, ceremonies or other visitors while taking photographs.<\/p>\n<p>Drones should not be used without the required permission.<\/p>\n<p>Be especially respectful during religious ceremonies, funerals and private community events.<\/p>\n<p>A photograph should never come at the cost of someone’s comfort, dignity or spiritual practice.<\/p>\n<h3>Environmental Responsibility<\/h3>\n<p>Bhutan places strong importance on protecting its forests, wildlife and natural landscapes.<\/p>\n<p>Carry reusable water bottles and bags where practical. Avoid leaving plastic, food waste or other litter behind.<\/p>\n<p>Use marked trails and follow your guide’s instructions in forests, valleys and protected areas.<\/p>\n<p>Do not disturb wildlife or approach animals for photographs.<\/p>\n<p>Avoid picking flowers, removing plants or collecting stones from natural and sacred places.<\/p>\n<p>Keep rivers, lakes and streams clean. Do not throw waste or wash personal items in natural water sources.<\/p>\n<p>Responsible travel helps preserve Bhutan’s environment for local communities and future visitors.<\/p>\n<h3>Practical Travel Behaviour<\/h3>\n<p>Follow your guide’s advice during road journeys, hikes and visits to remote areas.<\/p>\n<p>Keep identification documents and travel permits accessible when required.<\/p>\n<p>Be patient with changing weather, mountain roads and local travel conditions. Bhutan is best experienced at a comfortable pace.<\/p>\n<p>Respect local queues, public spaces and community routines.<\/p>\n<p>Avoid giving money, sweets or gifts directly to children without guidance. Support local communities through responsible purchases and recognised initiatives instead.<\/p>\n<p>Smoking and alcohol may be restricted in certain public, religious or protected areas. Follow local signs and your guide’s instructions.<\/p>\n<p>Travel with an open mind. Small changes in schedule can happen and are often part of travelling through a mountainous country.<\/p>\n<h3>Things Travellers should avoid<\/h3>\n<p>Avoid entering restricted areas or leaving established routes without guidance.<\/p>\n<p>Do not touch religious objects, masks, murals or ceremonial items unless permission is clearly given.<\/p>\n<p>Avoid loud conversations, disruptive behaviour and inappropriate clothing at temples, monasteries and community events.<\/p>\n<p>Do not photograph people at close range without asking.<\/p>\n<p>Avoid feeding wildlife or encouraging animals to approach.<\/p>\n<p>Do not leave litter, remove natural objects or damage plants.<\/p>\n<p>Avoid making promises, offering gifts or giving money to children without discussing it with your guide.<\/p>\n<p>Do not ignore local instructions. Most guidance is given to protect travellers, communities and sacred places.<\/p>\n<h3>Travel with Respect<\/h3>\n<p>Bhutan welcomes travellers who approach the country with curiosity, patience and respect.<\/p>\n<p>You do not need to understand every custom before you arrive. Your guide will help you follow local practices and explain anything unfamiliar along the way.<\/p>\n<p>Simple choices such as dressing appropriately, asking before taking photographs, listening to local guidance and protecting the environment can make your journey more meaningful for everyone involved.<\/p>\n<p>Respectful travel allows you to experience Bhutan more deeply while helping preserve its culture, communities and natural landscapes.<\/p>\n<p>Google Sites<\/p>\n<p>Report abuse<\/p>\n<p>Page details<\/p>\n<p>Page updated<\/p>\n<p>Google Sites<\/p>\n<p>Report abuse<\/p>","published":true},{"id":"pg-about-us","slug":"about-us","title":"About La Bhutanz Tours","html":"<p>La Bhutanz Tours specialises in personalised Bhutan journeys for travellers from Mumbai, Thane, Navi Mumbai and across India, along with NRI and international travellers seeking authentic, meaningful and luxury experiences in the Kingdom of Bhutan.<\/p><p>Bhutan is one of the world's most peaceful and inspiring travel destinations. Nestled in the Eastern Himalayas, the Kingdom is renowned for its breathtaking mountain landscapes, ancient monasteries, vibrant festivals and rich Buddhist heritage.<\/p><p>From the iconic Tiger's Nest Monastery in Paro and the cultural charm of Thimphu to the scenic valleys of Punakha, Gangtey and Bumthang, Bhutan offers travellers a rare opportunity to experience authentic Himalayan culture, untouched natural beauty and meaningful moments of tranquility.<\/p><p>At La Bhutanz Tours, we create personalised Bhutan journeys thoughtfully designed around your interests, travel style and preferred pace. Whether you are planning a family holiday, honeymoon, cultural tour, photography expedition, wellness retreat or private group journey, every itinerary is carefully curated to create meaningful and memorable experiences in Bhutan.<\/p><p>We believe every traveller experiences Bhutan differently. Instead of offering one-size-fits-all itineraries, we take the time to understand what matters most to you and recommend experiences that match your expectations. From peaceful monasteries and scenic valleys to colourful festivals, Himalayan landscapes and authentic Bhutanese culture, every journey is planned with attention to comfort, flexibility and genuine local experiences.<\/p><p>From your first enquiry to your return journey, our team is here to guide you every step of the way. We assist with itinerary planning, accommodation selection, transportation arrangements, permits and travel guidance, working closely with trusted local partners to ensure your Bhutan journey is seamless, comfortable and memorable.<\/p><p>Whether you are visiting Bhutan for the first time or returning to explore more of the Kingdom of Happiness, La Bhutanz Tours is committed to helping you travel with confidence through personalised planning, trusted local expertise and thoughtfully curated Bhutan journeys.<\/p><h3>Why choose La Bhutanz Tours<\/h3><ul><li>Personalized Bhutan journeys tailored to your interests and travel style<\/li><li>Flexible itineraries for couples, families, solo travelers and private groups<\/li><li>Local destination expertise across Paro, Thimphu, Punakha, Gangtey and Bumthang<\/li><li>Assistance with Bhutan permits, travel planning and documentation<\/li><li>Handpicked hotels, comfortable transportation and dependable local support<\/li><li>Cultural, spiritual, photography, festival and adventure experiences<\/li><li>Dedicated assistance before, during and after your journey<\/li><li>Private departures and personalised holidays designed around your preferred travel dates, interests and pace<\/li><\/ul>","published":true},{"id":"pg-terms","slug":"terms","title":"Terms & Cancellation Policy","html":"<p><i>These are starter terms. Please review them with the owner before relying on them.<\/i><\/p><h3>Booking &amp; payment<\/h3><p>A booking is confirmed once the advance amount is received and acknowledged in writing. The balance is payable before departure on the date communicated by La Bhutanz Tours.<\/p><h3>Cancellation &amp; refunds<\/h3><p>Cancellation charges depend on how close to departure the booking is cancelled and on non-refundable costs already paid to airlines, hotels and the Bhutan authorities (including the SDF). The applicable schedule is shared with every quotation.<\/p><h3>Itinerary changes<\/h3><p>Sightseeing may be re-ordered or changed because of weather, road conditions, festivals or government directives. Costs arising from natural calamities, landslides, road blockages or strikes are borne by the guest.<\/p><h3>Travel documents &amp; insurance<\/h3><p>Guests must carry valid identity documents and travel insurance. Entry into Bhutan is at the discretion of immigration officials.<\/p>","published":true},{"id":"pg-photo-credits","slug":"photo-credits","title":"Photo credits","html":"<p>Photographs on this website are from <a href=\"https://unsplash.com\" target=\"_blank\" rel=\"noopener\">Unsplash<\/a> and used under the Unsplash License, which allows free use. Thank you to the photographers below.<\/p><table><thead><tr><th>Photo<\/th><th>Photographer<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td>Dochula chortens (home banner)<\/td><td>Truly Bhutan<\/td><td><a href=\"https://unsplash.com/photos/a-building-with-many-umbrellas-in-the-snow-XdjhBoNgRPY\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Punakha Dzong (home banner)<\/td><td>Arghya Mondal<\/td><td><a href=\"https://unsplash.com/photos/a-large-building-sitting-on-top-of-a-hill-next-to-a-river-_qKdtPdVKBY\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Tiger’s Nest (home banner)<\/td><td>Unsplash photographer<\/td><td><a href=\"https://unsplash.com/photos/a-mountain-with-a-building-on-top-of-it-1eswIwEugnc\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Prayer flags (home banner)<\/td><td>Unsplash photographer<\/td><td><a href=\"https://unsplash.com/photos/selective-photo-of-buntings-FbVAJN4AZgg\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Punakha Dzong<\/td><td>Raimond Klavins<\/td><td><a href=\"https://unsplash.com/photos/white-and-brown-concrete-building-near-body-of-water-under-blue-and-white-cloudy-sky-during-aUq4yyB2yIs\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Tiger’s Nest<\/td><td>Ugyen Tenzin<\/td><td><a href=\"https://unsplash.com/photos/a-cliff-with-a-building-on-top-of-it-glRaWFLRl44\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Paro valley<\/td><td>Pema Gyamtsho<\/td><td><a href=\"https://unsplash.com/photos/a-green-valley-with-buildings-and-mountains-L1ROGwnRHAU\" target=\"_blank\" rel=\"noo "noopener\">View photo<\/a><\/td><\/tr><tr><td>Buddha Dordenma<\/td><td>Passang Tobgay<\/td><td><a href=\"https://unsplash.com/photos/a-large-buddha-statue-sitting-on-top-of-a-fountain-tryFyFUWVqk\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Dochula chortens<\/td><td>Pema Gyamtsho<\/td><td><a href=\"https://unsplash.com/photos/traditional-bhutanese-architecture-with-ornate-roofs-against-blue-sky-MpVmi1AsHiE\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Golden Buddha<\/td><td>Raimond Klavins<\/td><td><a href=\"https://unsplash.com/photos/gold-buddha-statue-on-gold-and-blue-floral-wall-A9EypdRirFQ\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Prayer wheels and flags<\/td><td>Rama Krushna Behera<\/td><td><a href=\"https://unsplash.com/photos/prayer-flags-and-wheels-adorn-mountain-viewpoint-WfPtofaMDrM\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Mountain road<\/td><td>Rama Krushna Behera<\/td><td><a href=\"https://unsplash.com/photos/winding-road-through-green-landscape-with-prayer-flags-61aAA8P5S8s\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Dzong by the river<\/td><td>Rahul Viswanath<\/td><td><a href=\"https://unsplash.com/photos/temple-surrounded-with-trees-facing-body-of-water-0LX1KSJ9uhs\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Archery<\/td><td>Pema Gyamtsho<\/td><td><a href=\"https://unsplash.com/photos/man-in-yellow-white-and-red-stripe-polo-shirt-and-orange-shorts-standing-on-green-and-e1u8YFRXXvY\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Dzong courtyard<\/td><td>Deepavali Gaind<\/td><td><a href=\"https://unsplash.com/photos/a-bird-sitting-on-the-ground-in-front-of-a-building-oeMegERu8fQ\" target=\"_blank\" rel=\"noopener\">View photo<\/a><\/td><\/tr><tr><td>Dzong walls<\/td><td>Kushal Villa<\/td><td><a href=\"https://unsplash.com/photos/a-white-and-red-building-with-a-   /* ---------- generic form + editors ---------- */
  function fieldHtml(f, v, prefix) {

    if (f.t === 'textarea') return `<div class="full">${lab}<textarea id="${id}" rows="${f.r || 4}">${esc(val)}</textarea></div>`;
    if (f.t === 'html') return `<div class="full">${lab}<textarea id="${id}" class="code">${esc(val)}</textarea><div class="sub">HTML allowed: &lt;h3&gt; &lt;p&gt; &lt;ul&gt;&lt;li&gt; &lt;a&gt; &lt;b&gt; &lt;img&gt;. Scripts are stripped.</div></div>`;

    if (f.t === 'repeater') return `<div class="full"><label>${f.l}</label><div id="${id}" data-rep="${f.k}">${(val || []).map((it, i) => repItem(f, it, id, i)).join('')}</div><button type="button" class="btn btn-ghost btn-sm" data-add="${id}">+ Add</button></div>`;

  function readForm(root, fields, prefix) {

        <td><div class="tools"><button class="btn btn-primary btn-sm" data-edit="${p.id}">Full details</button><a class="btn btn-ghost btn-sm" target="_blank" href="../" data-x="/package/${esc(p.slug)}">View</a><button class="btn btn-ghost btn-sm" data-del="${p.id}">✕</button></div></td></tr>`).join('')}</tbody></table></div>`;
      $('#new').onclick = () => full(null);
      $('#bulk').onclick = guard(async () => { const pc = Number($('#pct').value); if (!isFinite(pc) || !confirm(`Change every price by ${pc}%?`)) return;
        for (const p of list) if (p.price > 0) { const np = Math.round(p.price * (1 + pc / 100) / 100) * 100; await api('PUT', '/packages/' + p.id, { price: np }); p.price = np; p.priceConfirmed = true; } toast('Prices updated'); draw(); });
      m.onchange = guard(async e => { const tr = e.target.closest('tr[data-id]'), f = e.target.dataset.f; if (!tr || !f) return; const p = list.find(x => x.id === tr.dataset.id);
        const v = e.target.type === 'checkbox' ? e.target.checked : Number(e.target.value) || 0; const s = await api('PUT', '/packages/' + p.id, { [f]: v }); Object.assign(p, s); toast('Saved'); if (f === 'price') draw(); });
      m.onclick = guard(async e => { const ed = e.target.closest('[data-edit]'), dl = e.target.closest('[data-del]'); if (ed) full(list.find(x => x.id === ed.dataset.edit));
        if (dl && confirm('Delete this package? Its departures will remain but show as “Package”.')) { await api('DELETE', '/packages/' + dl.dataset.del); list = list.filter(x => x.id !== dl.dataset.del); state.pkgs = list; draw(); } });
    };
    const full = item => {
      const v = item || { category: 'fly', nights: 5, days: 6, price: 0, active: true, featured: false, flightIncluded: false, order: list.length, highlights: [], itinerary: [], inclusions: [], exclusions: [], ideal: [], faqs: [] };
      m.innerHTML = `<div class="row"><h1 style="margin:0">${item ? 'Edit' : 'New'} package</h1><button class="btn btn-ghost" id="back">← Back</button></div><div class="panel"><div class="fgrid">${PKG_FIELDS.map(f => fieldHtml(f, v[f.k], 'f_')).join('')}</div><p style="margin-top:18px"><button class="btn btn-primary" id="save">Save package</button></p></div>`;
      m.onclick = null; m.onchange = null; bindForm(m, PKG_FIELDS, 'f_'); $('#back').onclick = draw;
      $('#save').onclick = guard(async () => { const body = readForm(m, PKG_FIELDS, 'f_'); const s = item ? await api('PUT', '/packages/' + item.id, body) : await api('POST', '/packages', body); if (item) Object.assign(item, s); else list.push(s); state.pkgs = list; toast('Saved'); draw(); });
    };
    draw();
  }

  const posts = m => editor(m, { coll: 'posts', title: 'Journal', intro: 'Travel guides shown at /blog and on the home page.', sort: (a, b) => a.date < b.date ? 1 : -1,
    cols: [['Title', x => esc(x.title)], ['Date', x => fd(x.date)], ['Published', x => x.published ? '✓' : 'Draft']],
    blank: () => ({ date: new Date().toISOString().slice(0, 10), published: true }),
    fields: [{ k: 'title', l: 'Title', full: true }, { k: 'slug', l: 'URL slug' }, { k: 'date', l: 'Date', t: 'date' }, { k: 'excerpt', l: 'Short excerpt', t: 'textarea', r: 2 }, { k: 'image', l: 'Cover image', t: 'image' }, { k: 'body', l: 'Article', t: 'html' }, { k: 'published', l: 'Published', t: 'checkbox' }] });
  const faqs = m => editor(m, { coll: 'faqs', title: 'FAQs', sort: (a, b) => a.order - b.order, cols: [['#', x => x.order], ['Question', x => esc(x.q)], ['Visible', x => x.active ? '✓' : '—']],
    blank: () => ({ active: true, order: 99 }), fields: [{ k: 'q', l: 'Question', full: true }, { k: 'a', l: 'Answer', t: 'textarea', r: 5 }, { k: 'order', l: 'Order', t: 'number' }, { k: 'active', l: 'Visible', t: 'checkbox' }] });
  const tst = m => editor(m, { coll: 'testimonials', title: 'Testimonials', intro: 'Add real guest reviews (with permission). The section stays hidden until you add one.', cols: [['Guest', x => esc(x.name)], ['Place', x => esc(x.place)], ['Rating', x => '★'.repeat(x.rating || 5)], ['Visible', x => x.active ? '✓' : '—']],
    blank: () => ({ active: true, rating: 5 }), fields: [{ k: 'name', l: 'Guest name' }, { k: 'place', l: 'City / trip' }, { k: 'rating', l: 'Rating (1–5)', t: 'number' }, { k: 'text', l: 'Review', t: 'textarea', r: 4 }, { k: 'active', l: 'Visible', t: 'checkbox' }] });
  const pages = m => editor(m, { coll: 'pages', title: 'Pages', intro: 'Content pages at /page/&lt;slug&gt; — visa guide, festivals, terms, privacy and more.', cols: [['Title', x => esc(x.title)], ['URL', x => '/page/' + esc(x.slug)], ['Published', x => x.published ? '✓' : 'Draft']],
    blank: () => ({ published: true }), fields: [{ k: 'title', l: 'Title', full: true }, { k: 'slug', l: 'URL slug' }, { k: 'html', l: 'Content', t: 'html' }, { k: 'published', l: 'Published', t: 'checkbox' }] });

  /* ---------- settings ---------- */
  async function set(m) {
    const s = await api('GET', '/settings'), g = (path) => path.split('.').reduce((o, k) => (o || {})[k], s);
    const F = [['Brand & home page', [['brand', 'Brand name'], ['tagline', 'Tagline'], ['heroTitle', 'Home headline'], ['heroSub', 'Home sub-headline', 'textarea'], ['logo', 'Logo', 'image'], ['heroImages', 'Home page slideshow photos (one address per line, 3–5 wide photos)', 'lines'], ['favicon', 'Favicon', 'image'], ['ogImage', 'Social share image', 'image'], ['siteUrl', 'Website address (https://…, for SEO)']]],
      ['Contact', [['whatsapp', 'WhatsApp number (digits, with country code)'], ['phone', 'Phone'], ['emails', 'Emails (one per line)', 'lines'], ['address', 'Office address', 'textarea'], ['hours', 'Office hours']]],
      ['Pricing & fees', [['sdfINR', 'SDF ₹ per person per night', 'number'], ['gstPct', 'GST %', 'number'], ['gstIncluded', 'Package prices already include GST', 'checkbox'], ['showPrices', 'Show prices publicly', 'checkbox'], ['advanceInfo', 'Booking advance message', 'textarea']]],
      ['Payment details (shown on How to book)', [['payment.upiId', 'UPI ID'], ['payment.accountName', 'Account name'], ['payment.bank', 'Bank & branch'], ['payment.accountNo', 'Account number'], ['payment.ifsc', 'IFSC'], ['payment.note', 'Note', 'textarea']]],
      ['Documents guests must provide', [['documents', 'One per line', 'lines']]],
      ['Announcement banner', [['announcement.enabled', 'Show banner', 'checkbox'], ['announcement.text', 'Banner text']]],
      ['Social links', ['instagram', 'facebook', 'youtube', 'tripadvisor', 'trustpilot', 'linkedin', 'pinterest', 'blog'].map(k => ['social.' + k, k[0].toUpperCase() + k.slice(1) + ' URL'])],
      ['SEO', [['seo.title', 'Home page title'], ['seo.description', 'Home page description', 'textarea']]]];
    const flat = F.flatMap(([, f]) => f);
    m.innerHTML = `<div class="row"><h1 style="margin:0">Settings</h1><button class="btn btn-primary" id="save">Save settings</button></div>${F.map(([t, fs]) => `<div class="panel"><h3>${t}</h3><div class="fgrid">${fs.map(([k, l, ty]) => fieldHtml({ k: k.replace(/\./g, '_'), l, t: ty || 'text', full: ty === 'textarea' || ty === 'image' }, g(k), 's_')).join('')}</div></div>`).join('')}`;
    bindForm(m, flat.map(([k, l, ty]) => ({ k: k.replace(/\./g, '_'), t: ty })), 's_');
    $('#save').onclick = guard(async () => {
      const body = {}; flat.forEach(([k, , ty]) => { const el = $('#s_' + k.replace(/\./g, '_')); const v = ty === 'checkbox' ? el.checked : ty === 'lines' ? el.value.split('\n').map(x => x.trim()).filter(Boolean) : ty === 'number' ? Number(el.value) || 0 : el.value;
        const parts = k.split('.'); let o = body; parts.slice(0, -1).forEach(p => o = o[p] = o[p] || {}); o[parts[parts.length - 1]] = v; });
      await api('PUT', '/settings', body); toast('Settings saved');
    });
  }

  /* ---------- security & backup ---------- */
  async function sec(m) {
    m.innerHTML = `<h1>Security &amp; backup</h1>
      <div class="panel"><h3>Change admin password</h3><div class="fgrid"><div><label for="cp">Current password</label><input id="cp" type="password" autocomplete="current-password"></div><div><label for="np">New password (min. 10 characters)</label><input id="np" type="password" autocomplete="new-password"></div></div><p style="margin-top:14px"><button class="btn btn-primary" id="chg">Update password</button></p></div>
      <div class="panel"><h3>Backup &amp; restore</h3><p class="note">The backup contains packages, departures, enquiries, pages and settings (not your password). A copy is also kept automatically before every restore.</p>
      <span class="note">Backup download works on the live server.</span> <label class="btn btn-ghost" style="margin:0">⬆ Restore from file<input type="file" id="rs" accept=".json" style="display:none"></label></div>`;
    $('#chg').onclick = guard(async () => { await api('POST', '/password', { current: $('#cp').value, next: $('#np').value }); state.mustChange = false; $('#cp').value = $('#np').value = ''; toast('Password updated'); });
    $('#rs').onchange = guard(async e => { const f = e.target.files[0]; if (!f || !confirm('Replace ALL current data with this backup?')) return; const j = JSON.parse(await f.text()); await api('POST', '/restore', j); toast('Restored'); boot(); });
  }

  boot();
})();
</script>

</body></html>
