# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# SQLite lives on the persistent disk, so run exactly ONE instance.
services:
  - type: web
    name: dhandha-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter            # persistent disks need a paid plan
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: JWT_SECRET, generateValue: true }
      - { key: ADMIN_PHONE, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: COMMISSION_PERCENT, value: "20" }
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: TWILIO_FROM, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
