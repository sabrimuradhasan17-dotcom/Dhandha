a{color:var(--brand)}img{max-width:100%;display:block}

.hero{position:relative;color:#fff;padding:96px 0 150px;background:linear-gradient(180deg,#240d0e 0%,#6a1719 50%,#b8862b 130%);overflow:hidden}
.hero .wrap{position:relative;z-index:2}.hero p{max-width:58ch;font-size:1.1rem;opacity:.93}.hero svg{position:absolute;bottom:-1px;left:0;width:100%;height:auto;z-index:1}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-size:.86rem;color:var(--ink)}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;counter-reset:s}.steps>div{position:relative;padding-left:54px}.steps>div::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.cta{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border-radius:24px;padding:40px;display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center}@media(max-width:800px){.cta{grid-template-columns:1fr;padding:26px}}

#mbar{display:none}@media(max-width:700px){#mbar{display:grid;grid-template-columns:1fr 1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--card);border-top:1px solid var(--line)}#mbar a,#mbar button{padding:12px 4px;text-align:center;text-decoration:none;font-size:.78rem;font-weight:600;color:var(--ink);background:none;border:0;font-family:inherit;cursor:pointer}.fab{bottom:74px}}
.crumb{font-size:.84rem;color:var(--ink2);margin-bottom:14px}.crumb a{color:var(--ink2)}
.pkg-hero{border-radius:var(--r);overflow:hidden;min-height:260px}.pkg-hero .art{min-height:260px;padding:26px}.pkg-hero .art span{font-size:2.2rem}

.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 26px;position:sticky;top:70px;background:var(--cream);padding:8px 0;z-index:5}.subnav a{padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:.84rem;text-decoration:none;color:var(--ink);background:var(--card)}
.days details{border-left:4px solid var(--saffron)}.days summary b{color:var(--brand)}.meta{font-size:.78rem;color:var(--ink2);margin-top:4px}
.ticks{list-style:none;padding:0;margin:0}.ticks li{padding:5px 0 5px 28px;position:relative}.ticks li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:700}.ticks.x li::before{content:"✕";color:var(--red)}
.est{background:color-mix(in srgb,var(--saffron) 14%,transparent);border-radius:14px;padding:14px;font-size:.9rem}.est div{display:flex;justify-content:space-between;gap:8px}.est .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--card);border-radius:22px;max-width:560px;width:100%;padding:26px;max-height:92vh;overflow:auto;position:relative}.modal .x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--ink)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
.err{color:var(--red);font-size:.86rem;min-height:1.2em}.hp{position:absolute;left:-9999px}
.prose{max-width:780px}.prose h3{margin-top:1.6em}.prose ul{padding-left:1.2em}.prose p,.prose li{color:var(--ink2)}
.post-card .art{min-height:130px}.tq{font-family:var(--head);font-size:1.3rem;line-height:1.4}
.empty{padding:30px;text-align:center;color:var(--ink2)}
.stat b,.kpi b,.price b,.side,.est{font-variant-numeric:lining-nums}
.stat b,.kpi b{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:1.7rem}

<script>
window.confirm = () => true; // the hosted viewer blocks confirm(); demo deletes are harmless and resettable
const sanitizeHtml = h => String(h || '')
  .replace(/<\s*(script|style|iframe|object|embed|link|meta|form)[\s\S]*?(<\/\s*\1\s*>|$)/gi, '')

n total)."},{"title":"Jodhpur to Jaisalmer","meta":"","desc":"Mehrangarh Fort and Jaswant Thada in the morning, then drive to Jaisalmer (about 5 hours)."},{"title":"Jaisalmer and the dunes","meta":"","desc":"Jaisalmer Fort and Patwon Ki Haveli, then a camel safari at Sam dunes with folk music and an overnight stay in a desert camp."},{"title":"Dunes sunrise and Jaisalmer","meta":"","desc":"Sunrise on the dunes, return to Jaisalmer and visit Gadisar Lake."},{"title":"Departure","meta":"","desc":"Transfer to Jaisalmer airport or railway station."}],"inclusions":["Hotel stays on twin-sharing basis, in the category you choose","Daily breakfast (other meals only where mentioned)","Private air-conditioned vehicle with driver for transfers and sightseeing as per the itinerary","Airport / railway station pick-up and drop","Toll, parking and driver allowances","A Skyland trip coordinator on call during your journey"],"exclusions":["Flights or train tickets to and from the starting point (can be arranged on request)","Meals not mentioned in the itinerary","Monument, park and activity entry fees, camera fees and optional activities","Personal expenses such as laundry, tips, porter charges and travel insurance","GST and any government permit fees, where applicable","Anything not listed under inclusions"],"ideal":["First-time visitors to India who want the highlights","Families and friends travelling together","History, architecture and photography lovers"],"faqs":[],"image":"img/packages/udaipur-jaisalmer-lakes-dunes-7d.jpg","destinations":["udaipur","jaisalmer"],"flightIncluded":false,"featured":false,"active":true,"order":17,"priceConfirmed":false}],"departures":[{"id":"dm1","packageId":"golden-triangle-6d","date":"2026-11-07","fromCity":"Delhi","seats":16,"booked":6,"priceOverride":0,"status":"open","airline":"","flightNo":"","route":"Delhi - Agra - Jaipur","depTime":"","arrTime":"","notes":"DEMO ROW"},{"id":"dm2","packageId":"ladakh-adventure-8d","date":"2026-12-02","fromCity":"Delhi","seats":14,"booked":12,"priceOverride":0,"status":"open","airline":"IndiGo","flightNo":"","route":"Delhi - Leh - Delhi","depTime":"","arrTime":"","notes":"DEMO ROW"},{"id":"dm3","packageId":"kerala-backwaters-7d","date":"2026-12-22","fromCity":"Mumbai","seats":12,"booked":0,"priceOverride":0,"status":"open","airline":"","flightNo":"","route":"","depTime":"","arrTime":"","notes":"DEMO ROW"}],"faqs":[{"id":"f0","q":"How do I book a trip with Skyland Tours & Travels?","a":"Send an enquiry through the website or message us on WhatsApp with your destination, dates and number of travellers. We reply with a day-wise itinerary and a quotation, and your booking is confirmed once the advance is received.","order":0,"active":true},{"id":"f1","q":"Can I customise a package?","a":"Yes. Every package on this site is a starting point. We can change hotels, add or remove destinations, adjust the pace or build a trip from scratch around your dates and budget.","order":1,"active":true},{"id":"f2","q":"Are flights and train tickets included?","a":"Packages cover your stay, local transport and sightseeing as listed in the inclusions. Flights and train tickets are not included unless a package says so, but we can arrange them for you on request.","order":2,"active":true},{"id":"f3","q":"What is the best time to visit India?","a":"It depends on the region. North and central India are best from October to March, the Himalayas from March to June and September to October, Ladakh from June to September, and the south and the islands from October to March or May. See our Best Time to Visit guide for details.","order":3,"active":true},{"id":"f4","q":"Do I need a permit for any of the destinations?","a":"Some areas need permits, such as parts of Ladakh, Sikkim and the North-East. Permit rules depend on the destination and your nationality and can change, so we confirm the current requirements and arrange permits wherever possible.","order":4,"active":true},{"id":"f5","q":"Which ID do I need to carry?","a":"Every traveller should carry an original government photo ID, such as an Aadhaar card, passport, voter ID or driving licence. Foreign nationals need their passport and a valid visa.","order":5,"active":true},{"id":"f6","q":"Do you arrange group tours and corporate travel?","a":"Yes. We plan family reunions, friends’ groups, school and college trips, pilgrimage groups and corporate offsites. Tell us the group size and dates and we will suggest the right itinerary and transport.","order":6,"active":true},{"id":"f7","q":"Is it safe to travel with children or senior citizens?","a":"Yes, with the right planning. We choose comfortable driving distances, suitable hotels and rest days, and we avoid high-altitude or strenuous activities when they are not suitable. Tell us about any health needs when you enquire.","order":7,"active":true},{"id":"f8","q":"What if the weather or road conditions change my plan?","a":"In hill regions, landslides, snowfall or road closures can change plans. Your trip coordinator will rearrange sightseeing wherever possible and keep you informed. Extra costs caused by such disruptions are payable by the guest.","order":8,"active":true},{"id":"f9","q":"How do I pay and what is the refund policy?","a":"Payment details are shared with your quotation. Cancellation charges depend on how close to departure you cancel and on non-refundable amounts already paid to hotels and airlines. Please read our Terms & Cancellation page.","order":9,"active":true}],"testimonials":[],"posts":[{"id":"p1","slug":"best-time-to-visit-india-region-by-region","title":"Best time to visit India, region by region","date":"2026-09-20","published":true,"image":"img/destinations/rajasthan.jpg","excerpt":"India has no single best season. Here is when each region is at its best.","body":"<p>India’s size means one region’s peak season can be another’s monsoon. Use this as a quick guide when choosing your dates.<\/p><h3>North India and Rajasthan: October to March<\/h3><p>Days are pleasant and nights are cool. Delhi, Agra, Jaipur, Udaipur and Jaisalmer are all at their best, and desert camps are comfortable.<\/p><h3>The Himalayas<\/h3><p>Himachal and Uttarakhand work well from March to June and again in September and October. Ladakh is best from June to September, when the high passes are open. Kashmir is lovely from April to October, and Gulmarg is a ski destination in winter.<\/p><h3>Kerala, Goa and the islands<\/h3><p>Kerala and Goa are best from October to March. The Andamans are best from October to May.<\/p><h3>The North-East<\/h3><p>Sikkim and Darjeeling shine in spring and autumn. Meghalaya is open from October to May, while June to September brings its dramatic waterfalls and heavy rain.<\/p><p>Not sure which month suits your plans? <a href=\"/contact\">Ask our team<\/a> and we will suggest dates.<\/p>"},{"id":"p2","slug":"planning-ladakh-altitude-and-acclimatisation","title":"Planning Ladakh: altitude and acclimatisation","date":"2026-09-27","published":true,"image":"img/destinations/ladakh.jpg","excerpt":"Leh is at about 3,500 metres. Build rest days in and you will enjoy it far more.","body":"<p>Leh sits at around 3,500 metres, and Pangong Tso is higher still, at over 4,200 metres. The thin air catches many first-time visitors off guard, so a good Ladakh plan starts with rest.<\/p><h3>Practical tips<\/h3><ul><li>Rest on your first day and keep your first two days light.<\/li><li>Drink plenty of water and avoid alcohol and heavy meals early on.<\/li><li>Climb gradually: the order of your trip matters, so we plan Leh first, then Nubra and Pangong.<\/li><li>Carry warm layers, sun protection and any regular medicines.<\/li><li>Tell your trip coordinator about heart, lung or blood-pressure conditions before booking.<\/li><\/ul><p>If you develop a severe headache, breathlessness or confusion, descend and seek medical help. Our Ladakh itineraries include rest days for exactly this reason.<\/p>"},{"id":"p3","slug":"kerala-houseboat-what-to-expect","title":"A night on a Kerala houseboat: what to expect","date":"2026-10-02","published":true,"image":"img/destinations/kerala.jpg","excerpt":"Meals, timings and tips for your first backwater cruise.","body":"<p>A houseboat stay in Alleppey is a highlight of any Kerala trip. Most cruises start around noon and finish by 9 or 10 the next morning.<\/p><h3>What is on board<\/h3><p>A houseboat has a private bedroom, a living area and a crew that cooks fresh Kerala meals, usually with fish, rice and vegetable curries. Tell us in advance if you are vegetarian.<\/p><h3>Tips<\/h3><ul><li>Boats usually moor for the night by sunset, since cruising in the dark is not permitted on many routes.<\/li><li>Air-conditioning typically runs only at night, so pack light cotton clothes for the day.<\/li><li>Carry insect repellent for the evening hours.<\/li><\/ul><p>Browse our <a href=\"/package/kerala-backwaters-7d\">Kerala Backwaters & Hills<\/a> and <a href=\"/package/munnar-alleppey-honeymoon-6d\">Kerala Honeymoon<\/a> packages to see how a houseboat night fits into a full trip.<\/p>"}],"pages":[{"id":"pg-about-us","published":true,"slug":"about-us","title":"About Skyland Tours & Travels","html":"<p>Skyland Tours & Travels plans holidays, pilgrimages and adventure trips across India, from the Himalayas to the southern tip and from the Thar desert to the Andaman Islands.<\/p><p>We are a single team for the whole journey: we choose hotels, arrange vehicles and guides, advise on permits and the best season, and stay on call while you travel. Every itinerary on this site is a starting point that we adapt to your dates, budget, group and pace.<\/p><h3>What we do<\/h3><ul><li>Holiday packages for families, couples, friends and senior travellers<\/li><li>Honeymoon and anniversary trips<\/li><li>Pilgrimage and spiritual tours<\/li><li>Adventure trips such as Ladakh, rafting and trekking<\/li><li>Group, school and corporate travel<\/li><li>Hotels, flights, train tickets, cabs and permit assistance<\/li><\/ul><h3>How we work<\/h3><ul><li>Clear itineraries and pricing before you pay<\/li><li>Honest advice on the best time to go and what to expect<\/li><li>A trip coordinator reachable by phone and WhatsApp during your journey<\/li><\/ul>"},{"id":"pg-travel-permits-and-documents","published":true,"slug":"travel-permits-and-documents","title":"Permits and documents for travelling in India","html":"<p>Most destinations in India need nothing more than a valid photo ID. A few regions have extra rules, and these can change, so we confirm the latest requirements and arrange permits for you wherever possible.<\/p><h3>Documents every traveller needs<\/h3><ul><li>An original government photo ID: Aadhaar, passport, voter ID or driving licence<\/li><li>For children, a birth certificate or school ID<\/li><li>For foreign nationals, a passport with a valid Indian visa<\/li><\/ul><h3>Regions that may need permits<\/h3><ul><li><b>Ladakh:<\/b> some areas such as Nubra and Pangong have permit or registration requirements.<\/li><li><b>Sikkim:<\/b> places close to the border, such as Nathula, need permits and have limited access days.<\/li><li><b>North-East states:<\/b> some states, including Arunachal Pradesh, Mizoram and Nagaland, require an Inner Line Permit or similar approval.<\/li><\/ul><p>Rules depend on your nationality and the season. Share your plan and we will tell you what applies.<\/p>"},{"id":"pg-terms","published":true,"slug":"terms","title":"Terms & Cancellation Policy","html":"<p><i>These are starter terms. Please review them before relying on them.<\/i><\/p><h3>Booking and payment<\/h3><p>A booking is confirmed once the advance amount is received and acknowledged in writing. The balance is payable before departure, on the date shared with your quotation.<\/p><h3>Cancellation and refunds<\/h3><p>Cancellation charges depend on how close to departure the booking is cancelled and on non-refundable amounts already paid to hotels, airlines, railways and other suppliers. The applicable schedule is shared with every quotation.<\/p><h3>Itinerary changes<\/h3><p>Sightseeing may be re-ordered or changed because of weather, road conditions, local events or government orders. Extra costs arising from natural calamities, landslides, road closures or strikes are borne by the guest.<\/p><h3>Travel documents and insurance<\/h3><p>Guests must carry valid identity documents. We recommend travel insurance for every trip.<\/p>"},{"id":"pg-privacy","published":true,"slug":"privacy","title":"Privacy Policy","html":"<p><i>Starter policy. Please review before launch.<\/i><\/p><p>We collect the details you submit in enquiry forms (name, phone, email and travel plans) only to respond to you, prepare quotations and arrange your trip. We do not sell your data. We may share necessary details with hotels, transport providers and permit authorities to arrange your journey. To ask us to delete your data, contact us using the details on the Contact page.<\/p>"}],"enquiries":[{"id":"e1","createdAt":"2026-10-08T04:27:47.785Z","name":"Priya Shah","phone":"+91 98200 11122","email":"priya@example.com","serviceType":"Honeymoon or anniversary trip","destination":"kerala","packageId":"munnar-alleppey-honeymoon-6d","departureId":"","travelMonth":"2026-12","adults":2,"children":0,"message":"Anniversary trip. Can we add a candle-lit dinner on the houseboat?","source":"/package/munnar-alleppey-honeymoon-6d","status":"new","notes":""},{"id":"e2","createdAt":"2026-10-06T21:15:47.785Z","name":"Rohit Mehta","phone":"9987654321","email":"","serviceType":"Holiday package","destination":"rajasthan","packageId":"golden-triangle-6d","departureId":"dm1","travelMonth":"","adults":4,"children":1,"message":"Family of 5, vegetarian.","source":"/departures","status":"contacted","notes":"Called, sending quote tomorrow."},{"id":"e3","createdAt":"2026-10-04T09:15:47.785Z","name":"Anita Rao","phone":"9876500000","email":"anita@example.com","serviceType":     if ((x = p.match(/^\/(\w+)(?:\/(\w[\w-]*))?$/)) && SCHEMAS[x[1]]) {
      const c = x[1], id = x[2], sc = SCHEMAS[c];
      if (m === 'GET') return R(DB[c]);
      if (m === 'POST') {
        const o = clean(sc, body || {}), key = SLUGGED[c];
        if (key) { o.slug = slugify(o.slug || o[key] || '') || uid(); if (DB[c].some(q => q.slug === o.slug)) o.slug += '-' + uid().slice(0, 3); o.id = (c === 'packages' || c === 'destinations') ? o.slug : (c === 'pages' ? 'pg-' + o.slug : uid()); } else o.id = uid();
        if (c === 'departures' && !dateOk(o.date)) return R({ error: 'Valid date required.' }, 400);
        if (c === 'packages') { o.active = o.active !== false; o.priceConfirmed = o.price > 0; o.order = o.order || DB.packages.length; }
        DB[c].push(o); save(); return R(o);
      }
      const o = DB[c].find(q => q.id === id); if (!o) return R({ error: 'Not found' }, 404);
      if (m === 'DELETE') { DB[c] = DB[c].filter(q => q.id !== id); save(); return R({ ok: true }); }
      const upd = clean(sc, body || {});
      if (upd.slug !== undefined) { upd.slug = slugify(upd.slug) || o.slug; if (DB[c].some(q => q.slug === upd.slug && q.id !== o.id)) return R({ error: 'That URL slug is already used.' }, 400); }
      if (c === 'packages' && upd.price !== undefined && upd.price !== o.price) upd.priceConfirmed = true;

    }

  };
})();

<script>(function () {

  const root = $('#root');
  let state = { tab: 'dash', pkgs: [], dests: [], mustChange: false, newCount: 0 };

  async function api(method, url, body, raw) {

    const j = await r.json().catch(() => ({}));

  }
  function toast(msg, bad) { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
  const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };

  /* ---------- login ---------- */

    const go = async () => { try { const j = await api('POST', '/login', { password: $('#pw').value.trim() }); state.mustChange = j.mustChange; boot(); } catch (e) { $('#err').textContent = e.message; } };
    $('#go').onclick = go; setTimeout(() => { const g = $('#go'); if (g) g.focus(); }, 0); $('#pw').onkeydown = e => e.key === 'Enter' && go();
  }

  /* ---------- shell ---------- */
  const TABS = [['dash', '📊 Dashboard'], ['enq', '📨 Enquiries'], ['dep', '✈ Departures & flights'], ['pkg', '💰 Packages & prices'], ['dest', '🗺 Destinations'], ['posts', '📝 Journal'], ['faqs', '❓ FAQs'], ['tst', '⭐ Testimonials'], ['pages', '📄 Pages'], ['set', '⚙ Settings'], ['sec', '🔒 Security & backup']];

    $$('[data-tab]').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; shell(); view(); });

  async function boot() {

  }
  const pkgName = id => { const p = state.pkgs.find(x => x.id === id); return p ? `${p.name} ${p.nights}N/${p.days}D` : '—'; };

  /* ---------- dashboard ---------- */

    $$('[data-go]', m).forEach(a => a.onclick = e => { e.preventDefault(); state.tab = a.dataset.go; shell(); view(); });
  }

  /* ---------- enquiries ---------- */
  async function enq(m) {
    let list = await api('GET', '/enquiries'); const STAT = ['new', 'contacted', 'quoted', 'booked', 'lost'];
    m.innerHTML = `<div class="row"><h1 style="margin:0">Enquiries</h1><div class="tools"><select id="fs"><option value="">All statuses</option>${STAT.map(s => `<option>${s}</option>`).join('')}</select><input id="fq" placeholder="Search name / phone…" style="width:200px"><span class="note">CSV export works on the live server</span></div></div><div class="table-wrap"><table style="min-width:1000px"><thead><tr><th>When</th><th>Guest</th><th>Interest</th><th>Message</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;
    const waLink = e => { let d = e.phone.replace(/\D/g, ''); if (d.length === 10) d = '91' + d; return 'https://wa.me/' + d + '?text=' + encodeURIComponent(`Hello ${e.name}, this is Skyland Tours & Travels regarding your travel enquiry.`); };

      const s = $('#fs').value, q = $('#fq').value.toLowerCase();

      $('#rows').innerHTML = l.map(e => `<tr data-id="${e.id}"><td>${fd(e.createdAt)}<div class="sub">${new Date(e.createdAt).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</div></td>
        <td><b>${esc(e.name)}</b><div class="sub"><a href="tel:${esc(e.phone)}">${esc(e.phone)}</a>${e.email ? ` · <a href="mailto:${esc(e.email)}">${esc(e.email)}</a>` : ''}</div></td>
        <td>${esc(e.serviceType || '')}<div class="sub">${esc([(state.dests.find(d => d.slug === e.destination) || {}).name, e.packageId ? pkgName(e.packageId) : ''].filter(Boolean).join(' · '))}</div><div class="sub">${e.departureId ? 'Dep. selected · ' : ''}${esc(e.travelMonth || '')} · ${e.adults}A${e.children ? ' + ' + e.children + 'C' : ''}</div></td>
        <td style="max-width:260px">${esc(e.message)}</td>

    m.onchange = guard(async e => { const tr = e.target.closest('tr[data-id]'); const f = e.target.dataset.f; if (!tr || !f) return; const d = list.find(x => x.id === tr.dataset.id);

  /* ---------- generic form + editors ---------- */
  function fieldHtml(f, v, prefix) {
    const id = prefix + f.k, val = v == null ? (f.t === 'checkbox' ? false : '') : v, cls = f.full ? 'full' : '';
    const lab = `<label for="${id}">${f.l}</label>`;

    if (f.t === 'lines') return `<div class="full">${lab}<textarea id="${id}" rows="${f.r || 6}">${esc((val || []).join('\n'))}</textarea><div class="sub">One item per line</div></div>`;
    if (f.t === 'textarea') return `<div class="full">${lab}<textarea id="${id}" rows="${f.r || 4}">${esc(val)}</textarea></div>`;
    if (f.t === 'html') return `<div class="full">${lab}<textarea id="${id}" class="code">${esc(val)}</textarea><div class="sub">HTML allowed: &lt;h3&gt; &lt;p&gt; &lt;ul&gt;&lt;li&gt; &lt;a&gt; &lt;b&gt; &lt;img&gt;. Scripts are stripped.</div></div>`;
    if (f.t === 'image') return `<div class="${cls || 'full'}">${lab}<div style="display:flex;gap:8px"><input id="${id}" value="${esc(val)}" placeholder="https://… or upload"><label class="btn btn-ghost btn-sm" style="margin:0;white-space:nowrap">Upload<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-up="${id}" style="display:none"></label></div>${val ? `<img class="imgprev" src="${esc(val)}" alt="">` : ''}</div>`;
    if (f.t === 'repeater') return `<div class="full"><label>${f.l}</label><div id="${id}" data-rep="${f.k}">${(val || []).map((it, i) => repItem(f, it, id, i)).join('')}</div><button type="button" class="btn btn-ghost btn-sm" data-add="${id}">+ Add</button></div>`;
    return `<div class="${cls}">${lab}<input id="${id}" type="${f.t || 'text'}" value="${esc(val)}" ${f.t === 'number' ? 'step="any"' : ''}></div>`;
  }
  const repItem = (f, it, id, i) => `<div class="rep" data-i="${i}"><button type="button" class="btn btn-ghost btn-sm del" data-rm>✕</button>${f.s.map(s => `<div><label>${s.l}</label>${s.t === 'textarea' ? `<textarea data-s="${s.k}" rows="${s.r || 3}">${esc(it[s.k])}</textarea>` : `<input data-s="${s.k}" value="${esc(it[s.k])}">`}</div>`).join('')}</div>`;
  function readForm(root, fields, prefix) {
    const o = {};
    fields.forEach(f => {
      const id = prefix + f.k, el = $('#' + id, root);
      if (f.t === 'checkbox') o[f.k] = el.checked;
      else if (f.t === 'multi') o[f.k] = $$('input:checked', el).map(i => i.value);
      else if (f.t === 'lines') o[f.k] = el.value.split('\n').map(x => x.trim()).filter(Boolean);
      else if (f.t === 'number') o[f.k] = Number(el.value) || 0;
      else if (f.t === 'repeater') o[f.k] = $$('.rep', el).map(r => Object.fromEntries(f.s.map(s => [s.k, $(`[data-s="${s.k}"]`, r).value])));
      else o[f.k] = el.value;
    });
    return o;
  }
  function bindForm(root, fields, prefix) {

    const onClick = e => {
      const add = e.target.closest('[data-add]'); if (add) { const box = $('#' + add.dataset.add), f = fields.find(x => prefix + x.k === add.dataset.add); box.insertAdjacentHTML('beforeend', repItem(f, {}, box.id, box.children.length)); }
      if (e.target.matches('[data-rm]')) e.target.closest('.rep').remove();
    };
    const onChange = guard(async e => {
      if (!e.target.dataset.up) return; const file = e.target.files[0]; if (!file) return;
      const r = await fetch('/api/admin/upload', { method: 'POST', body: file, credentials: 'same-origin' }); const j = await r.json(); if (!r.ok) throw new Error(j.error);
      $('#' + e.target.dataset.up, root).value = j.url; toast('Image uploaded — remember to save');
    });
    root.addEventListener('click', onClick); root.addEventListener('change', onChange); root._bound = [['click', onClick], ['change', onChange]];
  }

  function editor(m, cfg) {
    return (async () => {
      let list = await api('GET', '/' + cfg.coll);
      const draw = () => {
        m.innerHTML = `<div class="row"><h1 style="margin:0">${cfg.title}</h1><button class="btn btn-primary" id="new">+ Add new</button></div>${cfg.intro ? `<p class="note">${cfg.intro}</p>` : ''}<div class="table-wrap"><table style="min-width:640px"><thead><tr>${cfg.cols.map(c => `<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>${(cfg.sort ? [...list].sort(cfg.sort) : list).map(x => `<tr>${cfg.cols.map(c => `<td>${c[1](x)}</td>`).join('')}<td><div class="tools"><button class="btn btn-primary btn-sm" data-edit="${x.id}">Edit</button><button class="btn btn-ghost btn-sm" data-del="${x.id}">✕</button></div></td></tr>`).join('') || `<tr><td colspan="9" class="empty">Nothing here yet.</td></tr>`}</tbody></table></div>`;

          if (dl && confirm('Delete this item?')) { await api('DELETE', '/' + cfg.coll + '/' + dl.dataset.del, undefined); list = list.filter(x => x.id !== dl.dataset.del); if (cfg.coll === 'packages') state.pkgs = list; if (cfg.coll === 'destinations') state.dests = list; draw(); } });

        m.innerHTML = `<div class="row"><h1 style="margin:0">${item ? 'Edit' : 'New'} — ${cfg.title}</h1><button class="btn btn-ghost" id="back">← Back to list</button></div><div class="panel"><div class="fgrid">${cfg.fields.map(f => fieldHtml(f, v[f.k], pre)).join('')}</div><p style="margin-top:18px"><button class="btn btn-primary" id="save">Save</button></p></div>`;

        $('#back').onclick = draw;
        $('#save').onclick = guard(async () => {
          const body = readForm(m, cfg.fields, pre);
          const saved = item ? await api('PUT', '/' + cfg.coll + '/' + item.id, body) : await api('POST', '/' + cfg.coll, body);
          if (item) Object.assign(item, saved); else list.push(saved);
          if (cfg.coll === 'packages') state.pkgs = list; if (cfg.coll === 'destinations') state.dests = list; toast('Saved'); draw();
        });
      };
      draw();
    })();
  }
  const YN = [['true', 'Yes'], ['false', 'No']];

  /* packages: quick price list + full editor */
  const PKG_FIELDS = [
    { k: 'name', l: 'Name' }, { k: 'slug', l: 'URL slug (e.g. fly-5n6d)' },
    { k: 'category', l: 'Trip style', t: 'select', o: [['heritage', 'Heritage & culture'], ['hills', 'Hills & mountains'], ['beach', 'Beaches & islands'], ['honeymoon', 'Honeymoon'], ['adventure', 'Adventure'], ['spiritual', 'Spiritual & pilgrimage'], ['family', 'Family holidays']] },
    { k: 'destinations', l: 'Destinations covered (shows the package on those destination pages)', t: 'multi', o: () => state.dests.map(d => [d.slug, d.name]) },
    { k: 'nights', l: 'Nights', t: 'number' }, { k: 'days', l: 'Days', t: 'number' }, { k: 'price', l: 'Price ₹ per person (0 = on request)', t: 'number' },
    { k: 'stay', l: 'Route and stays (e.g. Jaipur 2N · Udaipur 2N)', full: true },
    { k: 'summary', l: 'Short summary (shown on cards)', t: 'textarea', r: 2 }, { k: 'intro', l: 'Introduction (blank line = new paragraph)', t: 'textarea', r: 6 },
    { k: 'image', l: 'Cover photo (shown on cards and at the top of the package page)', t: 'image' },
    { k: 'highlights', l: 'Journey highlights', t: 'lines' },
    { k: 'itinerary', l: 'Day-by-day itinerary', t: 'repeater', s: [{ k: 'title', l: 'Day title' }, { k: 'meta', l: 'Travel info (distance · time)' }, { k: 'desc', l: 'Description', t: 'textarea', r: 4 }] },
    { k: 'inclusions', l: 'Inclusions', t: 'lines' }, { k: 'exclusions', l: 'Exclusions', t: 'lines' }, { k: 'ideal', l: 'Who is it ideal for?', t: 'lines' },
    { k: 'faqs', l: 'Package FAQs', t: 'repeater', s: [{ k: 'q', l: 'Question' }, { k: 'a', l: 'Answer', t: 'textarea' }] },
    { k: 'flightIncluded', l: 'Flights or trains included in price', t: 'checkbox' }, { k: 'featured', l: 'Show on home page', t: 'checkbox' }, { k: 'active', l: 'Visible on website', t: 'checkbox' }, { k: 'order', l: 'Sort order (small = first)', t: 'number' }
  ];
  async function pkg(m) {
    let list = await api('GET', '/packages'); state.pkgs = list;
    const draw = () => {
      m.innerHTML = `<div class="row"><h1 style="margin:0">Packages &amp; prices</h1><div class="tools"><input id="pct" type="number" value="5" style="width:80px" aria-label="Percent"><button class="btn btn-ghost btn-sm" id="bulk">Change all prices by %</button><button class="btn btn-primary" id="new">+ Add package</button></div></div>
      <p class="note">Edit prices in the table (₹ per person) — they save automatically and show on the website straight away. Click “Full details” to edit itinerary, inclusions, photo and more.</p>
      <div class="table-wrap"><table style="min-width:820px"><thead><tr><th>Package</th><th>Style</th><th>Price ₹ / person</th><th>Visible</th><th>Home page</th><th></th></tr></thead><tbody>${[...list].sort((a, b) => a.order - b.order).map(p => `<tr data-id="${p.id}"><td><b>${esc(p.name)}</b> ${p.nights}N/${p.days}D<div class="sub">${p.price > 0 ? '' : '⚠ no price yet — shown as “On request”'}</div></td><td>${esc(p.category)}</td>
        <td><input type="number" min="0" data-f="price" value="${p.price}"></td><td><input type="checkbox" data-f="active" ${p.active ? 'checked' : ''}></td><td><input type="checkbox" data-f="featured" ${p.featured ? 'checked' : ''}></td>
        <td><div class="tools"><button class="btn btn-primary btn-sm" data-edit="${p.id}">Full details</button><a class="btn btn-ghost btn-sm" target="_blank" href="../" data-x="/package/${esc(p.slug)}">View</a><button class="btn btn-ghost btn-sm" data-del="${p.id}">✕</button></div></td></tr>`).join('')}</tbody></table></div>`;
      $('#new').onclick = () => full(null);
      $('#bulk').onclick = guard(async () => { const pc = Number($('#pct').value); if (!isFinite(pc) || !confirm(`Change every price by ${pc}%?`)) return;
        for (const p of list) if (p.price > 0) { const np = Math.round(p.price * (1 + pc / 100) / 100) * 100; await api('PUT', '/packages/' + p.id, { price: np }); p.price = np; p.priceConfirmed = true; } toast('Prices updated'); draw(); });
      m.onchange = guard(async e => { const tr = e.target.closest('tr[data-id]'), f = e.target.dataset.f; if (!tr || !f) return; const p = list.find(x => x.id === tr.dataset.id);
        const v = e.target.type === 'checkbox' ? e.target.checked : Number(e.target.value) || 0; const s = await api('PUT', '/packages/' + p.id, { [f]: v }); Object.assign(p, s); toast('Saved'); if (f === 'price') draw(); });
      m.onclick = guard(async e => { const ed = e.target.closest('[data-edit]'), dl = e.target.closest('[data-del]'); if (ed) full(list.find(x => x.id === ed.dataset.edit));
        if (dl && confirm('Delete this package? Its departures will remain but show as “Package”.')) { await api('DELETE', '/packages/' + dl.dataset.del); list = list.filter(x => x.id !== dl.dataset.del); state.pkgs = list; draw(); } });
    };
    const full = item => {
      const v = item || { category: 'heritage', destinations: [], nights: 5, days: 6, price: 0, active: true, featured: false, flightIncluded: false, order: list.length, highlights: [], itinerary: [], inclusions: [], exclusions: [], ideal: [], faqs: [] };
      m.innerHTML = `<div class="row"><h1 style="margin:0">${item ? 'Edit' : 'New'} package</h1><button class="btn btn-ghost" id="back">← Back</button></div><div class="panel"><div class="fgrid">${PKG_FIELDS.map(f => fieldHtml(f, v[f.k], 'f_')).join('')}</div><p style="margin-top:18px"><button class="btn btn-primary" id="save">Save package</button></p></div>`;
      m.onclick = null; m.onchange = null; bindForm(m, PKG_FIELDS, 'f_'); $('#back').onclick = draw;
      $('#save').onclick = guard(async () => { const body = readForm(m, PKG_FIELDS, 'f_'); const s = item ? await api('PUT', '/packages/' + item.id, body) : await api('POST', '/packages', body); if (item) Object.assign(item, s); else list.push(s); state.pkgs = list; toast('Saved'); draw(); });
    };
    draw();
  }

  const dest = m => editor(m, { coll: 'destinations', title: 'Destinations', intro: 'Each destination has its own page on the website (/destination/name) listing the packages that cover it.', sort: (a, b) => a.name.localeCompare(b.name),
    cols: [['Destination', x => esc(x.name)], ['State', x => esc(x.state)], ['Region', x => esc(x.region)], ['Visible', x => x.active ? '✓' : '—']],
    blank: () => ({ active: true, region: 'North', highlights: [] }),
    fields: [{ k: 'name', l: 'Name' }, { k: 'slug', l: 'URL slug (e.g. kerala)' }, { k: 'state', l: 'State / union territory' }, { k: 'region', l: 'Region', t: 'select', o: ['North', 'South', 'East', 'West', 'Central', 'North-East', 'Islands'].map(r => [r, r]) },
      { k: 'tagline', l: 'One-line tagline', full: true }, { k: 'bestTime', l: 'Best time to visit' }, { k: 'image', l: 'Photo', t: 'image' }, { k: 'description', l: 'Description', t: 'textarea', r: 5 }, { k: 'highlights', l: 'Highlights (one per line)', t: 'lines' }, { k: 'active', l: 'Visible on website', t: 'checkbox' }] });
  const posts = m => editor(m, { coll: 'posts', title: 'Journal', intro: 'Travel guides shown at /blog and on the home page.', sort: (a, b) => a.date < b.date ? 1 : -1,
    cols: [['Title', x => esc(x.title)], ['Date', x => fd(x.date)], ['Published', x => x.published ? '✓' : 'Draft']],
    blank: () => ({ date: new Date().toISOString().slice(0, 10), published: true }),
    fields: [{ k: 'title', l: 'Title', full: true }, { k: 'slug', l: 'URL slug' }, { k: 'date', l: 'Date', t: 'date' }, { k: 'excerpt', l: 'Short excerpt', t: 'textarea', r: 2 }, { k: 'image', l: 'Cover image', t: 'image' }, { k: 'body', l: 'Article', t: 'html' }, { k: 'published', l: 'Published', t: 'checkbox' }] });
  const faqs = m => editor(m, { coll: 'faqs', title: 'FAQs', sort: (a, b) => a.order - b.order, cols: [['#', x => x.order], ['Question', x => esc(x.q)], ['Visible', x => x.active ? '✓' : '—']],
    blank: () => ({ active: true, order: 99 }), fields: [{ k: 'q', l: 'Question', full: true }, { k: 'a', l: 'Answer', t: 'textarea', r: 5 }, { k: 'order', l: 'Order', t: 'number' }, { k: 'active', l: 'Visible', t: 'checkbox' }] });
  const tst = m => editor(m, { coll: 'testimonials', title: 'Testimonials', intro: 'Add real guest reviews (with permission). The section stays hidden until you add one.', cols: [['Guest', x => esc(x.name)], ['Place', x => esc(x.place)], ['Rating', x => '★'.repeat(x.rating || 5)], ['Visible', x => x.active ? '✓' : '—']],
    blank: () => ({ active: true, rating: 5 }), fields: [{ k: 'name', l: 'Guest name' }, { k: 'place', l: 'City / trip' }, { k: 'rating', l: 'Rating (1–5)', t: 'number' }, { k: 'text', l: 'Review', t: 'textarea', r: 4 }, { k: 'active', l: 'Visible', t: 'checkbox' }] });
  const pages = m => editor(m, { coll: 'pages', title: 'Pages', intro: 'Content pages at /page/&lt;slug&gt; — visa guide, festivals, terms, privacy and more.', cols: [['Title', x => esc(x.title)], ['URL', x => '/page/' + esc(x.slug)], ['Published', x => x.published ? '✓' : 'Draft']],
    blank: () => ({ published: true }), fields: [{ k: 'title', l: 'Title', full: true }, { k: 'slug', l: 'URL slug' }, { k: 'html', l: 'Content', t: 'html' }, { k: 'published', l: 'Published', t: 'checkbox' }] });

  /* ---------- settings ---------- */
  async function set(m) {
    const s = await api('GET', '/settings'), g = (path) => path.split('.').reduce((o, k) => (o || {})[k], s);
    const F = [['Brand & home page', [['brand', 'Brand name'], ['tagline', 'Tagline'], ['heroTitle', 'Home headline'], ['heroSub', 'Home sub-headline', 'textarea'], ['logo', 'Logo', 'image'], ['heroImage', 'Home page banner photo', 'image'], ['favicon', 'Favicon', 'image'], ['ogImage', 'Social share image', 'image'], ['siteUrl', 'Website address (https://…, for SEO)']]],
      ['Contact', [['whatsapp', 'WhatsApp number (digits, with country code)'], ['phone', 'Phone'], ['emails', 'Emails (one per line)', 'lines'], ['address', 'Office address', 'textarea'], ['hours', 'Office hours']]],
      ['Pricing & fees', [['gstPct', 'GST %', 'number'], ['gstIncluded', 'Package prices already include GST', 'checkbox'], ['showPrices', 'Show prices publicly', 'checkbox'], ['advanceInfo', 'Booking advance message', 'textarea']]],
      ['Payment details (shown on How to book)', [['payment.upiId', 'UPI ID'], ['payment.accountName', 'Account name'], ['payment.bank', 'Bank & branch'], ['payment.accountNo', 'Account number'], ['payment.ifsc', 'IFSC'], ['payment.note', 'Note', 'textarea']]],
      ['Documents guests must provide', [['documents', 'One per line', 'lines']]],
      ['Announcement banner', [['announcement.enabled', 'Show banner', 'checkbox'], ['announcement.text', 'Banner text']]],
      ['Social links', ['instagram', 'facebook', 'youtube', 'linkedin', 'x'].map(k => ['social.' + k, k[0].toUpperCase() + k.slice(1) + ' URL'])],
      ['SEO', [['seo.title', 'Home page title'], ['seo.description', 'Home page description', 'textarea']]]];
    const flat = F.flatMap(([, f]) => f);
    m.innerHTML = `<div class="row"><h1 style="margin:0">Settings</h1><button class="btn btn-primary" id="save">Save settings</button></div>${F.map(([t, fs]) => `<div class="panel"><h3>${t}</h3><div class="fgrid">${fs.map(([k, l, ty]) => fieldHtml({ k: k.replace(/\./g, '_'), l, t: ty || 'text', full: ty === 'textarea' || ty === 'image' }, g(k), 's_')).join('')}</div></div>`).join('')}`;
    bindForm(m, flat.map(([k, l, ty]) => ({ k: k.replace(/\./g, '_'), t: ty })), 's_');
    $('#save').onclick = guard(async () => {
      const body = {}; flat.forEach(([k, , ty]) => { const el = $('#s_' + k.replace(/\./g, '_')); const v = ty === 'checkbox' ? el.checked : ty === 'lines' ? el.value.split('\n').map(x => x.trim()).filter(Boolean) : ty === 'number' ? Number(el.value) || 0 : el.value;
        const parts = k.split('.'); let o = body; parts.slice(0, -1).forEach(p => o = o[p] = o[p] || {}); o[parts[parts.length - 1]] = v; });
      await api('PUT', '/settings', body); toast('Settings saved');
    });
  }

  /* ---------- security & backup ---------- */
  async function sec(m) {
    m.innerHTML = `<h1>Security &amp; backup</h1>
      <div class="panel"><h3>Change admin password</h3><div class="fgrid"><div><label for="cp">Current password</label><input id="cp" type="password" autocomplete="current-password"></div><div><label for="np">New password (min. 10 characters)</label><input id="np" type="password" autocomplete="new-password"></div></div><p style="margin-top:14px"><button class="btn btn-primary" id="chg">Update password</button></p></div>
      <div class="panel"><h3>Backup &amp; restore</h3><p class="note">The backup contains packages, departures, enquiries, pages and settings (not your password). A copy is also kept automatically before every restore.</p>
      <span class="note">Backup download works on the live server.</span> <label class="btn btn-ghost" style="margin:0">⬆ Restore from file<input type="file" id="rs" accept=".json" style="display:none"></label></div>`;
    $('#chg').onclick = guard(async () => { await api('POST', '/password', { current: $('#cp').value, next: $('#np').value }); state.mustChange = false; $('#cp').value = $('#np').value = ''; toast('Password updated'); });
    $('#rs').onchange = guard(async e => { const f = e.target.files[0]; if (!f || !confirm('Replace ALL current data with this backup?')) return; const j = JSON.parse(await f.text()); await api('POST', '/restore', j); toast('Restored'); boot(); });
  }

  boot();
})();
</script>

</body></html>
