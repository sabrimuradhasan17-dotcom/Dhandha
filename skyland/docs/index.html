.hero .wrap{position:relative;z-index:2}.hero p{max-width:58ch;font-size:1.1rem;opacity:.93}.hero svg{position:absolute;bottom:-1px;left:0;width:100%;height:auto;z-index:1}

label{font-size:.76rem;font-weight:600;color:var(--ink2);display:block;margin-bottom:4px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:-62px;position:relative;z-index:3}
.stat{background:var(--card);border-radius:var(--r);padding:18px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line)}.stat b{font-family:var(--head);font-size:2rem;color:var(--brand);display:block;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-size:.86rem;color:var(--ink)}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:22px}

.art.fly{background-image:linear-gradient(135deg,#27443a,#4e8a73)}.art.drive{background-image:linear-gradient(135deg,#7a4a1c,#d08a3a)}.art.special{background-image:linear-gradient(135deg,#5a2150,#b2487e)}.art.fixed{background-image:linear-gradient(135deg,#6a1719,#c08a2e)}

.card .body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.72rem;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--saffron) 24%,transparent)}

.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}th{background:color-mix(in srgb,var(--saffron) 16%,transparent);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase}
.pill{padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap}.pill.open{background:#dff5e7;color:#14653a}.pill.few{background:#fdecc8;color:#8a5a00}.pill.full{background:#f9d6d2;color:#8a1f14}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:20px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}.feat .ic{font-size:1.8rem}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details[open] summary{color:var(--brand)}details p,details .acc-b{color:var(--ink2);margin:.7em 0 0}

.cta{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border-radius:24px;padding:40px;display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center}@media(max-width:800px){.cta{grid-template-columns:1fr;padding:26px}}

.fab{position:fixed;right:18px;bottom:18px;z-index:60;width:62px;height:62px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pulse 2.4s infinite}.fab svg{width:36px;height:36px;fill:#fff}

#mbar{display:none}@media(max-width:700px){#mbar{display:grid;grid-template-columns:1fr 1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--card);border-top:1px solid var(--line)}#mbar a,#mbar button{padding:12px 4px;text-align:center;text-decoration:none;font-size:.78rem;font-weight:600;color:var(--ink);background:none;border:0;font-family:inherit;cursor:pointer}.fab{bottom:74px}}
.crumb{font-size:.84rem;color:var(--ink2);margin-bottom:14px}.crumb a{color:var(--ink2)}
.pkg-hero{border-radius:var(--r);overflow:hidden;min-height:260px}.pkg-hero .art{min-height:260px;padding:26px}.pkg-hero .art span{font-size:2.2rem}

.side{position:sticky;top:90px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 26px;position:sticky;top:70px;background:var(--cream);padding:8px 0;z-index:5}.subnav a{padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:.84rem;text-decoration:none;color:var(--ink);background:var(--card)}

e air-conditioned vehicle with driver for transfers and sightseeing as per the itinerary","Airport / railway station pick-up and drop","Toll, parking and driver allowances","A Skyland trip coordinator on call during your journey"],"exclusions":["Flights or train tickets to and from the starting point (can be arranged on request)","Meals not mentioned in the itinerary","Monument, park and activity entry fees, camera fees and optional activities","Personal expenses such as laundry, tips, porter charges and travel insurance","GST and any government permit fees, where applicable","Anything not listed under inclusions"],"ideal":["First-time visitors to India who want the highlights","Families and friends travelling together","History, architecture and photography lovers"],"faqs":[],"image":"img/packages/kutch-rann-utsav-5d.jpg","destinations":["gujarat-kutch"],"flightIncluded":false,"featured":false,"active":true,"order":16,"priceConfirmed":false},{"id":"udaipur-jaisalmer-lakes-dunes-7d","slug":"udaipur-jaisalmer-lakes-dunes-7d","category":"heritage","name":"Lakes & Dunes: Udaipur, Jodhpur & Jaisalmer","nights":6,"days":7,"price":0,"singleSupplement":0,"stay":"Udaipur 2N · Jodhpur 1N · Jaisalmer 2N · Sam dunes camp 1N","summary":"A lake-palace city, a blue city and a night in the desert.","intro":"From Udaipur’s lakes to Jodhpur’s mighty fort and Jaisalmer’s golden walls, finishing with a night at a desert camp near the Sam sand dunes.","highlights":["City Palace, Udaipur","Mehrangarh Fort, Jodhpur","Jaisalmer Fort","Sam dunes camel safari and desert camp"],"itinerary":[{"title":"Arrive in Udaipur","meta":"","desc":"Pick-up and check-in. Evening at Fateh Sagar or Saheliyon Ki Bari."},{"title":"Udaipur sightseeing","meta":"","desc":"City Palace, Jagdish Temple and a sunset boat ride on Lake Pichola."},{"title":"Udaipur to Jodhpur via Ranakpur","meta":"","desc":"Visit the Jain temples of Ranakpur and continue to Jodhpur (about 6 to 7 hours in total)."},{"title":"Jodhpur to Jaisalmer","meta":"","desc":"Mehrangarh Fort and Jaswant Thada in the morning, then drive to Jaisalmer (about 5 hours)."},{"title":"Jaisalmer and the dunes","meta":"","desc":"Jaisalmer Fort and Patwon Ki Haveli, then a camel safari at Sam dunes with folk music and an overnight stay in a desert camp."},{"title":"Dunes sunrise and Jaisalmer","meta":"","desc":"Sunrise on the dunes, return to Jaisalmer and visit Gadisar Lake."},{"title":"Departure","meta":"","desc":"Transfer to Jaisalmer airport or railway station."}],"inclusions":["Hotel stays on twin-sharing basis, in the category you choose","Daily breakfast (other meals only where mentioned)","Private air-conditioned vehicle with driver for transfers and sightseeing as per the itinerary","Airport / railway station pick-up and drop","Toll, parking and driver allowances","A Skyland trip coordinator on call during your journey"],"exclusions":["Flights or train tickets to and from the starting point (can be arranged on request)","Meals not mentioned in the itinerary","Monument, park and activity entry fees, camera fees and optional activities","Personal expenses such as laundry, tips, porter charges and travel insurance","GST and any government permit fees, where applicable","Anything not listed under inclusions"],"ideal":["First-time visitors to India who want the highlights","Families and friends travelling together","History, architecture and photography lovers"],"faqs":[],"image":"img/packages/udaipur-jaisalmer-lakes-dunes-7d.jpg","destinations":["udaipur","jaisalmer"],"flightIncluded":false,"featured":false,"active":true,"order":17,"priceConfirmed":false}],"departures":[],"faqs":[{"id":"f0","q":"How do I book a trip with Skyland Tours & Travels?","a":"Send an enquiry through the website or message us on WhatsApp with your destination, dates and number of travellers. We reply with a day-wise itinerary and a quotation, and your booking is confirmed once the advance is received.","order":0,"active":true},{"id":"f1","q":"Can I customise a package?","a":"Yes. Every package on this site is a starting point. We can change hotels, add or remove destinations, adjust the pace or build a trip from scratch around your dates and budget.","order":1,"active":true},{"id":"f2","q":"Are flights and train tickets included?","a":"Packages cover your stay, local transport and sightseeing as listed in the inclusions. Flights and train tickets are not included unless a package says so, but we can arrange them for you on request.","order":2,"active":true},{"id":"f3","q":"What is the best time to visit India?","a":"It depends on the region. North and central India are best from October to March, the Himalayas from March to June and September to October, Ladakh from June to September, and the south and the islands from October to March or May. See our Best Time to Visit guide for details.","order":3,"active":true},{"id":"f4","q":"Do I need a permit for any of the destinations?","a":"Some areas need permits, such as parts of Ladakh, Sikkim and the North-East. Permit rules depend on the destination and your nationality and can change, so we confirm the current requirements and arrange permits wherever possible.","order":4,"active":true},{"id":"f5","q":"Which ID do I need to carry?","a":"Every traveller should carry an original government photo ID, such as an Aadhaar card, passport, voter ID or driving licence. Foreign nationals need their passport and a valid visa.","order":5,"active":true},{"id":"f6","q":"Do you arrange group tours and corporate travel?","a":"Yes. We plan family reunions, friends’ groups, school and college trips, pilgrimage groups and corporate offsites. Tell us the group size and dates and we will suggest the right itinerary and transport.","order":6,"active":true},{"id":"f7","q":"Is it safe to travel with children or senior citizens?","a":"Yes, with the right planning. We choose comfortable driving distances, suitable hotels and rest days, and we avoid high-altitude or strenuous activities when they are not suitable. Tell us about any health needs when you enquire.","order":7,"active":true},{"id":"f8","q":"What if the weather or road conditions change my plan?","a":"In hill regions, landslides, snowfall or road closures can change plans. Your trip coordinator will rearrange sightseeing wherever possible and keep you informed. Extra costs caused by such disruptions are payable by the guest.","order":8,"active":true},{"id":"f9","q":"How do I pay and what is the refund policy?","a":"Payment details are shared with your quotation. Cancellation charges depend on how close to departure you cancel and on non-refundable amounts already paid to hotels and airlines. Please read our Terms & Cancellation page.","order":9,"active":true}],"testimonials":[],"posts":[{"id":"p1","slug":"best-time-to-visit-india-region-by-region","title":"Best time to visit India, region by region","date":"2026-09-20","published":true,"image":"img/destinations/rajasthan.jpg","excerpt":"India has no single best season. Here is when each region is at its best."},{"id":"p2","slug":"planning-ladakh-altitude-and-acclimatisation","title":"Planning Ladakh: altitude and acclimatisation","date":"2026-09-27","published":true,"image":"img/destinations/ladakh.jpg","excerpt":"Leh is at about 3,500 metres. Build rest days in and you will enjoy it far more."},{"id":"p3","slug":"kerala-houseboat-what-to-expect","title":"A night on a Kerala houseboat: what to expect","date":"2026-10-02","published":true,"image":"img/destinations/kerala.jpg","excerpt":"Meals, timings and tips for your first backwater cruise."}],"pages":[{"id":"pg-about-us","published":true,"slug":"about-us","title":"About Skyland Tours & Travels"},{"id":"pg-travel-permits-and-documents","published":true,"slug":"travel-permits-and-documents","title":"Permits and documents for travelling in India"},{"id":"pg-terms","published":true,"slug":"terms","title":"Terms & Cancellation Policy"},{"id":"pg-privacy","published":true,"slug":"privacy","title":"Privacy Policy"}]},"posts":{"best-time-to-visit-india-region-by-region":{"id":"p1","slug":"best-time-to-visit-india-region-by-region","title":"Best time to visit India, region by region","date":"2026-09-20","published":true,"image":"/img/destinations/rajasthan.jpg","excerpt":"India has no single best season. Here is when each region is at its best.","body":"<p>India’s size means one region’s peak season can be another’s monsoon. Use this as a quick guide when choosing your dates.<\/p><h3>North India and Rajasthan: October to March<\/h3><p>Days are pleasant and nights are cool. Delhi, Agra, Jaipur, Udaipur and Jaisalmer are all at their best, and desert camps are comfortable.<\/p><h3>The Himalayas<\/h3><p>Himachal and Uttarakhand work well from March to June and again in September and October. Ladakh is best from June to September, when the high passes are open. Kashmir is lovely from April to October, and Gulmarg is a ski destination in winter.<\/p><h3>Kerala, Goa and the islands<\/h3><p>Kerala and Goa are best from October to March. The Andamans are best from October to May.<\/p><h3>The North-East<\/h3><p>Sikkim and Darjeeling shine in spring and autumn. Meghalaya is open from October to May, while June to September brings its dramatic waterfalls and heavy rain.<\/p><p>Not sure which month suits your plans? <a href=\"/contact\">Ask our team<\/a> and we will suggest dates.<\/p>"},"planning-ladakh-altitude-and-acclimatisation":{"id":"p2","slug":"planning-ladakh-altitude-and-acclimatisation","title":"Planning Ladakh: altitude and acclimatisation","date":"2026-09-27","published":true,"image":"/img/destinations/ladakh.jpg","excerpt":"Leh is at about 3,500 metres. Build rest days in and you will enjoy it far more.","body":"<p>Leh sits at around 3,500 metres, and Pangong Tso is higher still, at over 4,200 metres. The thin air catches many first-time visitors off guard, so a good Ladakh plan starts with rest.<\/p><h3>Practical tips<\/h3><ul><li>Rest on your first day and keep your first two days light.<\/li><li>Drink plenty of water and avoid alcohol and heavy meals early on.<\/li><li>Climb gradually: the order of your trip matters, so we plan Leh first, then Nubra and Pangong.<\/li><li>Carry warm layers, sun protection and any regular medicines.<\/li><li>Tell your trip coordinator about heart, lung or blood-pressure conditions before booking.<\/li><\/ul><p>If you develop a severe headache, breathlessness or confusion, descend and seek medical help. Our Ladakh itineraries include rest days for exactly this reason.<\/p>"},"kerala-houseboat-what-to-expect":{"id":"p3","slug":"kerala-houseboat-what-to-expect","title":"A night on a Kerala houseboat: what to expect","date":"2026-10-02","published":true,"image":"/img/destinations/kerala.jpg","excerpt":"Meals, timings and tips for your first backwater cruise.","body":"<p>A houseboat stay in Alleppey is a highlight of any Kerala trip. Most cruises start around noon and finish by 9 or 10 the next morning.<\/p><h3>What is on board<\/h3><p>A houseboat has a private bedroom, a living area and a crew that cooks fresh Kerala meals, usually with fish, rice and vegetable curries. Tell us in advance if you are vegetarian.<\/p><h3>Tips<\/h3><ul><li>Boats usually moor for the night by sunset, since cruising in the dark is not permitted on many routes.<\/li><li>Air-conditioning typically runs only at night, so pack light cotton clothes for the day.<\/li><li>Carry insect repellent for the evening hours.<\/li><\/ul><p>Browse our <a href=\"/package/kerala-backwaters-7d\">Kerala Backwaters & Hills<\/a> and <a href=\"/package/munnar-alleppey-honeymoon-6d\">Kerala Honeymoon<\/a> packages to see how a houseboat night fits into a full trip.<\/p>"}},"pages":{"about-us":{"id":"pg-about-us","published":true,"slug":"about-us","title":"About Skyland Tours & Travels","html":"<p>Skyland Tours & Travels plans holidays, pilgrimages and adventure trips across India, from the Himalayas to the southern tip and from the Thar desert to the Andaman Islands.<\/p><p>We are a single team for the whole journey: we choose hotels, arrange vehicles and guides, advise on permits and the best season, and stay on call while you travel. Every itinerary on this site is a starting point that we adapt to your dates, budget, group and pace.<\/p><h3>What we do<\/h3><ul><li>Holiday packages for families, couples, friends and senior travellers<\/li><li>Honeymoon and anniversary trips<\/li><li>Pilgrimage and spiritual tours<\/li><li>Adventure trips such as Ladakh, rafting and trekking<\/li><li>Group, school and corporate travel<\/li><li>Hotels, flights, train tickets, cabs and permit assistance<\/li><\/ul><h3>How we work<\/h3><ul><li>Clear itineraries and pricing before you pay<\/li><li>Honest advice on the best time to go and what to expect<\/li><li>A trip coordinator reachable by phone and WhatsApp during your journey<\/li><\/ul>"},"travel-permits-and-documents":{"id":"pg-travel-permits-and-documents","published":true,"slug":"travel-permits-and-documents","title":"Permits and documents for travelling in India","html":"<p>Most destinations in India need nothing more than a valid photo ID. A few regions have extra rules, and these can change, so we confirm the latest requirements and arrange permits for you wherever possible.<\/p><h3>Documents every traveller needs<\/h3><ul><li>An original government photo ID: Aadhaar, passport, voter ID or driving licence<\/li><li>For children, a birth certificate or school ID<\/li><li>For foreign nationals, a passport with a valid Indian visa<\/li><\/ul><h3>Regions that may need permits<\/h3><ul><li><b>Ladakh:<\/b> some areas such as Nubra and Pangong have permit or registration requirements.<\/li><li><b>Sikkim:<\/b> places close to the border, such as Nathula, need permits and have limited access days.<\/li><li><b>North-East states:<\/b> some states, including Arunachal Pradesh, Mizoram and Nagaland, require an Inner Line Permit or similar approval.<\/li><\/ul><p>Rules depend on your nationality and the season. Share your plan and we will tell you what applies.<\/p>"},"terms":{"id":"pg-terms","published":true,"slug":"terms","title":"Terms & Cancellation Policy","html":"<p><i>These are starter terms. Please review them before relying on them.<\/i><\/p><h3>Booking and payment<\/h3><p>A booking is confirmed once the advance amount is received and acknowledged in writing. The balance is payable before departure, on the date shared with your quotation.<\/p><h3>Cancellation and refunds<\/h3><p>Cancellation charges depend on how close to departure the booking is cancelled and on non-refundable amounts already paid to hotels, airlines, railways and other suppliers. The applicable schedule is shared with every quotation.<\/p><h3>Itinerary changes<\/h3><p>Sightseeing may be re-ordered or changed because of weather, road conditions, local events or government orders. Extra costs arising from natural calamities, landslides, road closures or strikes are borne by the guest.<\/p><h3>Travel documents and insurance<\/h3><p>Guests must carry valid identity documents. We recommend travel insurance for every trip.<\/p>"},"privacy":{"id":"pg-privacy","published":true,"slug":"privacy","title":"Privacy Policy","html":"<p><i>Starter policy. Please review before launch.<\/i><\/p><p>We collect the details you submit in enquiry forms (name, phone, email and travel plans) only to respond to you, prepare quotations and arrange your trip. We do not sell your data. We may share necessary details with hotels, transport providers and permit authorities to arrange your journey. To ask us to delete your data, contact us using the details on the Contact page.<\/p>"}},"credits":{"destinations/udaipur":{"page":"https://unsplash.com/photos/red-and-white-boat-on-body-of-water-near-beige-concrete-building-during-daytime-AVFjDGbqiqE","who":"Jainam Mehta","handle":"/@jainam09","title":"Red and white boat on body of water near beige concrete building during   async function postView(slug) {
    const r = await fetch('/api/post/' + encodeURIComponent(slug)); if (!r.ok) return notFound(); const p = await r.json(); document.title = p.title + ' | ' + S.brand;
    return `<section><div class="wrap prose"><div class="crumb"><a href="/">Home</a> › <a href="/blog">Travel journal</a></div><div class="note">${fd(p.date)}</div><h1 style="font-size:clamp(2rem,4vw,3rem)">${esc(p.title)}</h1>${p.image ? `<img src="${esc(p.image)}" alt="" style="border-radius:var(--r);margin:16px 0;width:100%">` : ''}${p.body}<p style="margin-top:30px"><button class="btn btn-primary" data-enq>Plan my trip</button></p></div></section>`;
  }
  async function pageView(slug) {
    const r = await fetch('/api/page/' + encodeURIComponent(slug)); if (!r.ok) return notFound(); const p = await r.json(); document.title = p.title + ' | ' + S.brand;
    return `<section><div class="wrap prose"><div class="crumb"><a href="/">Home</a> › ${esc(p.title)}</div><h1 style="font-size:clamp(2rem,4vw,3rem)">${esc(p.title)}</h1>${p.html}<p style="margin-top:30px"><button class="btn btn-primary" data-enq>Ask us a question</button> ${waBtn('', 'Hello ' + S.brand + ', I have a question about ' + p.title + '.')}</p></div></section>`;
  }
  const blogView = () => `<section><div class="wrap"><div class="crumb"><a href="/">Home</a> › Travel journal</div><h1>Travel journal</h1><p class="lead">Practical guides and ideas to help you plan your trip.</p><div class="grid" style="margin-top:24px">${D.posts.map(postCard).join('') || '<div class="empty">Articles coming soon.</div>'}</div></div></section>`;
  function faqView() {
    setTimeout(() => $('#fq').oninput = e => { const q = e.target.value.toLowerCase(); $$('#fq-list details').forEach(d => d.style.display = d.textContent.toLowerCase().includes(q) ? '' : 'none'); }, 0);
    return `<section><div class="wrap"><div class="crumb"><a href="/">Home</a> › FAQ</div><h1>Frequently asked questions</h1><p class="lead">Booking, payments, permits, seasons and more.</p><div style="max-width:820px"><input id="fq" placeholder="Search questions…" style="margin:16px 0" aria-label="Search FAQ"><div id="fq-list">${D.faqs.map(faqItem).join('')}</div></div>
      <p style="margin-top:20px">Can’t find your answer? <button class="btn btn-primary btn-sm" data-enq>Ask our team</button></p></div></section>`;
  }
  function contactView() {
    const map = S.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(S.address) : '';
    const lines = [S.address ? `<p>${esc(S.address)}</p>` : '', (hasPhone() || hasWA() || (S.emails || []).length) ? `<p>${hasPhone() ? `<b>Call:</b> <a href="${tel()}">${esc(S.phone)}</a><br>` : ''}${hasWA() ? `<b>WhatsApp:</b> <a target="_blank" rel="noopener" href="${esc(wa('Hello'))}">+${esc(S.whatsapp)}</a><br>` : ''}${(S.emails || []).length ? `<b>Email:</b> ${S.emails.map(e => `<a href="mailto:${esc(e)}">${esc(e)}</a>`).join(' · ')}` : ''}</p>` : '', S.hours ? `<p class="note">${esc(S.hours)}</p>` : '', map ? `<p><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${esc(map)}">Open in Google Maps</a></p>` : ''].join('') || '<p>Send us an enquiry and our team will get back to you.</p>';
    return `<section><div class="wrap"><div class="crumb"><a href="/">Home</a> › Contact</div><h1>Contact ${esc(S.brand)}</h1><p class="lead">Tell us where you want to go and when. We will reply with a personalised itinerary and quote.</p>
      <div class="cols" style="margin-top:20px"><div class="feat"><h3>Get in touch</h3>${lines}</div>
      <div class="feat"><h3>Send an enquiry</h3><p>Share your plan and we will respond with suggestions.</p><button class="btn btn-primary btn-block" data-enq>Plan my trip</button>${waBtn('btn-block', greet(), 'Chat on WhatsApp').replace('class="btn', 'style="margin-top:10px" class="btn')}</div></div></div></section>`;
  }
  function bookView() {
    const pay = S.payment || {}, has = pay.upiId || pay.bank || pay.accountNo;
    return `<section><div class="wrap prose"><div class="crumb"><a href="/">Home</a> › How to book &amp; pay</div><h1>How to book &amp; pay</h1>
      <div class="steps" style="margin:24px 0"><div><b>Enquire</b><br>Send an enquiry or WhatsApp us your dates and group size.</div><div><b>Receive your quote</b><br>A personalised itinerary with clear per-person pricing.</div><div><b>Pay the advance</b><br>${esc(S.advanceInfo)}</div><div><b>Share documents</b><br>Send ID details so we can arrange hotels, tickets and any permits.</div></div>
      ${has ? `<h3>Payment details</h3><div class="feat">${pay.upiId ? `<p><b>UPI:</b> ${esc(pay.upiId)}</p>` : ''}${pay.accountName ? `<p><b>Account name:</b> ${esc(pay.accountName)}</p>` : ''}${pay.bank ? `<p><b>Bank:</b> ${esc(pay.bank)}</p>` : ''}${pay.accountNo ? `<p><b>Account no.:</b> ${esc(pay.accountNo)}</p>` : ''}${pay.ifsc ? `<p><b>IFSC:</b> ${esc(pay.ifsc)}</p>` : ''}${pay.note ? `<p class="note">${esc(pay.note)}</p>` : ''}</div>` : '<p>We will share payment details (UPI or bank transfer) with your confirmed quotation.</p>'}
      ${(S.documents || []).length ? `<h3>Documents we need from you</h3><ul class="ticks">${S.documents.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      <p class="note">Please read our <a href="/page/terms">terms &amp; cancellation policy</a> before paying. ${S.gstPct}% GST applies on tour services where it is not already included.</p>
      <p><button class="btn btn-primary" data-enq>Start my enquiry</button></p></div></section>`;
  }
  async function creditsView() {
    let c = {}; try { c = await (await fetch('/api/credits')).json(); } catch (e) {}
    const label = k => { const [t, s] = k.split('/'); if (k === 'hero') return 'Home page banner'; const n = t === 'destinations' ? (destOf(s) || {}).name : (pkgOf(s) || {}).name; return (n || s) + (t === 'packages' ? ' (package)' : ''); };
    const rows = Object.entries(c).map(([k, v]) => `<tr><td>${esc(label(k))}</td><td>${esc(v.who || 'Unsplash photographer')}</td><td><a href="${esc(v.page)}" target="_blank" rel="noopener">View photo</a></td></tr>`).join('');
    return `<section><div class="wrap prose"><div class="crumb"><a href="/">Home</a> › Photo credits</div><h1>Photo credits</h1><p>Photographs on this website come from <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a> and are used under the Unsplash License, which allows free use. Thank you to the photographers below.</p>
      <div class="table-wrap" style="margin-top:20px"><table style="min-width:520px"><thead><tr><th>Used for</th><th>Photographer</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></div></div></section>`;
  }
  const notFound = () => { document.title = 'Page not found | ' + S.brand; return `<section><div class="wrap" style="text-align:center;padding:60px 0"><h1>Page not found</h1><p class="lead" style="margin:auto">That page doesn't exist, but there is plenty of India to explore.</p><p style="margin-top:20px"><a class="btn btn-primary" href="/destinations">Browse destinations</a></p></div></section>`; };

  /* ---------- router ---------- */
  async function render() {
    const p = __P().replace(/\/$/, '') || '/'; let m, html;
    document.title = S.seo.title;
    if (p === '/') html = home();
    else if (p === '/destinations') { document.title = 'Destinations across India | ' + S.brand; html = destinationsView(); }
    else if ((m = p.match(/^\/destination\/([\w-]+)$/))) html = destinationView(m[1]);
    else if (p === '/packages') { document.title = 'Tour packages | ' + S.brand; html = packagesView(); }
    else if ((m = p.match(/^\/package\/([\w-]+)$/))) html = packageView(m[1]);
    else if (p === '/departures') { document.title = 'Group departures | ' + S.brand; html = departuresView(); }
    else if (p === '/blog') { document.title = 'Travel journal | ' + S.brand; html = blogView(); }
    else if ((m = p.match(/^\/blog\/([\w-]+)$/))) html = await postView(m[1]);
    else if ((m = p.match(/^\/page\/([\w-]+)$/))) html = await pageView(m[1]);
    else if (p === '/faq') { document.title = 'FAQ | ' + S.brand; html = faqView(); }
    else if (p === '/contact') { document.title = 'Contact | ' + S.brand; html = contactView(); }
    else if (p === '/how-to-book') { document.title = 'How to book & pay | ' + S.brand; html = bookView(); }
    else if (p === '/credits') { document.title = 'Photo credits | ' + S.brand; html = await creditsView(); }
    else html = notFound();
    app.innerHTML = html;
    $('#menu') && $('#menu').classList.remove('open');
    window.scrollTo(0, 0);
  }
  function go(url) { __route = url.split('#')[0]; render(); }
  document.addEventListener('click', e => {
    const t = e.target;
    const enq = t.closest('[data-enq]'); if (enq) { e.preventDefault(); openEnquiry({ pkg: enq.dataset.pkg, dep: enq.dataset.dep, dest: enq.dataset.dest }); return; }
    if (t.closest('[data-close]') && !t.closest('a[href^="/"]')) { closeModal(); return; }
    if (t.id === 'mbg') { closeModal(); return; }
    if (t.id === 'burger') { $('#menu').classList.toggle('open'); return; }
    const a = t.closest('a[href]'); if (!a || a.target || e.metaKey || e.ctrlKey || e.shiftKey) return;
    const h = a.getAttribute('href');
    if (h && h.startsWith('/') && !/^\/(admin|uploads|api|sitemap|robots|img)/.test(h)) {
      e.preventDefault(); closeModal();
      if (h.startsWith('#') || (h.split('#')[0] === __P() && h.includes('#'))) { const el = $('#' + h.split('#')[1]); el && el.scrollIntoView(); } else go(h);
    } else if (h && h.startsWith('#')) { e.preventDefault(); const el = $(h); el && el.scrollIntoView({ behavior: 'smooth' }); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  

  (async function init() {
    try { D = await (await fetch('/api/site')).json(); S = D.settings; } catch (e) { app.innerHTML = '<div class="wrap" style="padding:80px 20px"><h2>We’ll be right back</h2><p>Please try again in a few minutes.</p></div>'; return; }
    layout(); render();
  })();
})();
</script>

</body></html>
